/* ---------- 내 급여 ---------- */
function vSettle(){
  const md=MONTHS[state.month];
  const r=computeMonth(state.month)[0];
  if(!r||!hasPay(r))return '<div class="card"><div class="empty">이번 달 입력한 공수가 없어요.<br>달력에서 날짜를 눌러 공수를 넣어주세요.</div></div>';
  const emp=r.emp;
  const taxLabel=emp.taxType==='insurance'?'4대보험':'사업소득세 '+num(cfgTaxRate(md)*100)+'%';
  const site=Object.entries(r.byComp||{}).sort((a,b)=>b[1]-a[1]);
  const allowRows=r.allow.items.filter(i=>i.amt>0).map(i=>
    `<div><span>${esc(i.a.name)} <span class="muted">${i.a.taxable?'세전':'세후'}</span></span><b>${won(i.amt)}</b></div>`).join('');
  const dedRows=emp.taxType==='insurance'
    ? [['국민연금',r.ded.pension],['건강보험',r.ded.health],['장기요양',r.ded.care],['고용보험',r.ded.employment]]
        .map(x=>`<div><span>${x[0]}</span><b class="m">-${won(x[1])}</b></div>`).join('')
    : `<div><span>사업소득세 ${num(cfgTaxRate(md)*100)}%</span><b class="m">-${won(r.tax)}</b></div>`;
  return `
    <div class="card">
      <div class="card-title">${mkLabel(state.month)} 내 급여</div>
      <div class="calcbox">
        <div><span>근무일수</span><b>${r.daysWorked}일</b></div>
        ${emp.payType!=='monthly'&&r.gongsu?`<div><span>${(r.otH||r.ntH)?'기본':'총'} ${payUnit(emp)}</span><b>${num(r.gongsu)}${payUnit(emp)}</b></div>`:''}
        ${r.offDays?`<div><span>휴무</span><b>${r.offDays}일</b></div>`:''}
        ${r.leaveDays?`<div><span>연차</span><b>${r.leaveDays}일</b></div>`:''}
        ${r.otH?`<div><span>연장</span><b>${num(r.otH)}시간</b></div>`:''}
        ${r.ntH?`<div><span>야간</span><b>${num(r.ntH)}시간</b></div>`:''}
        ${emp.payType==='hourly'&&(r.otH||r.ntH)?`<div><span>총 근무시간</span><b>${num(r.gongsu+r.otH+r.ntH)}시간</b></div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">받을 금액</div>
      <div class="calcbox">
        <div><span>기본급${r.meal?' (식대 제외)':''}</span><b>${won(r.wage-r.meal-r.otPay-r.ntPay)}</b></div>
        ${r.meal?`<div><span>식대</span><b>${won(r.meal)}</b></div>`:''}
        ${r.otPay?`<div><span>연장수당 (${num(r.otH)}h × ${num(otRateOf(emp))})</span><b>${won(r.otPay)}</b></div>`:''}
        ${r.ntPay?`<div><span>야간수당 (${num(r.ntH)}h × ${num(ntRateOf(emp))})</span><b>${won(r.ntPay)}</b></div>`:''}
        ${allowRows}
        <div class="mid"><span>세전 합계</span><b>${won(r.gross)}</b></div>
        ${dedRows}
        <div class="mid"><span>공제 계 <span class="muted">(${taxLabel})</span></span><b class="m">-${won(r.tax)}</b></div>
        ${r.advance?`<div><span>가불로 먼저 받음</span><b class="m">-${won(r.advance)}</b></div>`:''}
        <div class="tot"><span>실수령액</span><b>${won(r.net)}</b></div>
      </div>
      ${r.advanceBalance?`<div class="hint" style="color:var(--red);">이번 달 급여를 넘는 가불 ${won(r.advanceBalance)} 이 남았어요.</div>`:''}
      <button class="btn gray block" style="margin-top:12px;" data-act="openAllowSheet" data-args='["${emp.id}"]'>수당 넣고 빼기</button>
      <button class="btn gray block" style="margin-top:8px;" data-act="openAdvanceSheet" data-args='["${emp.id}"]'>가불 기록</button>
    </div>
    ${site.length?`<div class="card">
      <div class="card-title">현장별</div>
      <div class="calcbox">${site.map(([c,g])=>`<div><span>${esc(c||'현장 미지정')}</span><b>${num(g)}${payUnit(emp)}</b></div>`).join('')}</div>
    </div>`:''}
    ${yearCard()}`;
}
/* 올해 누적 — 3.3% 떼이는 사람은 5월에 신고하면 대부분 환급받는다.
   본인이 얼마 벌었는지 몰라서 신고를 못 하는 경우가 많아 여기서 알려준다. */
function yearCard(){
  const y=state.month.slice(0,4);
  let gross=0,tax=0,net=0,days=0,months=0;
  Object.keys(MONTHS).filter(mk=>mk.startsWith(y)).sort().forEach(mk=>{
    const r=computeMonth(mk)[0];
    if(!r||!hasPay(r))return;
    gross+=Math.round(r.gross);tax+=Math.round(r.tax);net+=Math.round(r.net);days+=r.daysWorked;months++;
  });
  if(!months)return '';
  const free=DB.employees[0]&&DB.employees[0].taxType!=='insurance';
  return `<div class="card">
    <div class="card-title">${y}년 누적 <span class="small muted">앱에 기록된 ${months}개월</span></div>
    <div class="calcbox">
      <div><span>근무일수</span><b>${days}일</b></div>
      <div><span>세전 소득</span><b>${won(gross)}</b></div>
      <div><span>떼인 세금</span><b>${won(tax)}</b></div>
      <div class="tot"><span>실수령 합계</span><b>${won(net)}</b></div>
    </div>
    ${free&&tax>0?`<div class="hint" style="margin-top:10px;">
      3.3% 로 떼인 세금이 <b>${won(tax)}</b> 있어요.
      <b>5월 종합소득세 신고를 하면 상당 부분 돌려받을 수 있습니다.</b>
      국세청 홈택스에서 직접 하거나 환급 대행 서비스를 쓰면 돼요.
    </div>`:''}
    <div class="hint">이 앱에 입력한 것만 계산한 값이에요. 실제 신고 금액과 다를 수 있습니다.</div>
  </div>`;
}
function setSettleSub(s){state.settleSub=s;render();}

/* ---------- 퇴직금 적립 현황 ----------
   매달 인건비에만 잡히던 퇴직금 적립액을 직원별로 모아서 보여준다.
   저장된 모든 달을 읽어 합치므로 요율을 바꿔도 그 달에 적립된 금액 그대로 쌓인다.

/* 직원별 수당 시트 */
function openAllowSheet(empId){
  const emp=empById(empId);
  const md=MONTHS[state.month];
  const r=computeMonth(state.month).find(x=>x.emp.id===empId);
  // 지난 달은 그때 적용됐던 수당 구성을 보여준다
  const rows=cfgAllowances(md).map(a=>{
    const st=(md.allow&&md.allow[empId]&&md.allow[empId][a.id])||{};
    const on=st.on!==false;
    const item=r.allow.items.find(i=>i.a.id===a.id);
    const amt=item?item.amt:0;
    const desc=a.method==='perDay'?`출근일수 × ${won(a.amount)}`:a.method==='fixed'?`월 고정 ${won(a.amount)}`:'금액 직접 입력';
    const blocked=!!(item&&item.blocked);
    const manualInput=a.method==='manual'?`<input type="number" style="width:110px;text-align:right;padding:8px 10px;margin-top:8px;" placeholder="금액" value="${st.amt||''}" data-onchange="setAllowAmt" data-args='["${empId}","${a.id}"]'>`:'';
    return `<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);">
      <div style="flex:1;">
        <div class="nm">${esc(a.name)} <span class="taxbadge ${a.taxable?'f':'i'}">${a.taxable?'세전':'세후'}</span></div>
        <div class="small muted" style="margin-top:2px;">${desc}${a.fullAttend?' · 만근 조건':''}${blocked?' · 이번 달 휴무가 있어 미지급':(on&&amt>0?' · 이번 달 '+won(amt):'')}</div>
        ${on?manualInput:''}
      </div>
      <label class="switch"><input type="checkbox" ${on?'checked':''} data-onchange="setAllowOn" data-args='["${empId}","${a.id}"]'><span class="tr"></span></label>
    </div>`;
  }).join('')||'<div class="empty">등록된 수당이 없어요.<br>관리 탭에서 추가할 수 있어요.</div>';
  openModal(`${esc(emp.name)} · ${mkLabel(state.month)} 수당`,`

function attendText(empId){
  const emp=empById(empId);
  const md=MONTHS[state.month];
  const days=md.attendance[empId]||{};
  const[y,m]=state.month.split('-').map(Number);
  const DOW=['일','월','화','수','목','금','토'];
  const list=Object.entries(days)
    .filter(([d,v])=>v&&v.g!==null&&v.g!==undefined&&v.g!=='')
    .sort((a,b)=>Number(a[0])-Number(b[0]))
    .map(([d,v])=>{
      const dow=DOW[new Date(y,m-1,Number(d)).getDay()];
      const k=kindOf(v);
      const what=k==='off'?'휴무':(k==='leave'?kindLabel(v)+' '+num(v.g)+payUnit(emp):num(v.g)+payUnit(emp));
      return `· ${m}/${d} (${dow}) ${v.c||''} ${what}`;
    });
  const r=computeMonth(state.month).find(x=>x.emp.id===empId);
  const rest=[r&&r.offDays?`휴무 ${r.offDays}일`:'',r&&r.leaveDays?`연차 ${r.leaveDays}일`:''].filter(Boolean).join(' / ');
  const lines=[
    `[공수뚝딱] ${mkLabel(state.month)} 출근·급여 확인`,
    `${emp.name}님, 이번 달 내역입니다.`,
    `잘못된 부분이 있으면 급여일 전까지 알려주세요.`,
    ``,
    `■ 출근 내역`,
    ...list,
    `· 합계: ${r?r.daysWorked:list.length}일 / ${num(r?r.gongsu:0)}${payUnit(emp)}${rest?' (제외 '+rest+')':''}`
  ];
  // 급여 내역 (대표 제외)
  if(r&&!emp.isOwner){
    const taxLabel=emp.taxType==='insurance'?'4대보험':'사업소득세 3.3%';
    lines.push(``,`■ 급여 내역`,`· 급여(식대 포함): ${won(r.wage)}`);
    r.allow.items.filter(i=>i.amt>0).forEach(i=>
      lines.push(`· ${i.a.name} (${i.a.taxable?'세전':'세후'}): ${won(i.amt)}`));
    lines.push(
      `· 세전 합계(공제 대상): ${won(r.taxBase)}`,
      `· 공제 (${taxLabel}): -${won(r.tax)}`
    );
    if(r.allow.freeSum>0)lines.push(`· 세후 수당 합계: +${won(r.allow.freeSum)}`);
    if(r.advance)lines.push(`· 가불 차감: -${won(r.advance)}`);
    lines.push(`· 실지급액: ${won(r.net)}`);
  }
  return lines.join('\n');
}

async function sharePayslip(empId,message){
  if(message===undefined)message='';
  const r=computeMonth(state.month).find(x=>x.emp.id===empId);
  if(!r||!hasPay(r)){toastMsg('이번 달 급여 데이터가 없어요');return;}
  toastMsg('명세서를 PDF로 만드는 중이에요');
  const file=await payslipPDF(r,message);
  if(!file)return;
  const msg=message;
  if(await sharePDFFile(file,`${r.emp.name} 급여명세서`,msg))return;
  // 파일 공유가 안 되는 환경(주로 PC): PDF 는 내려받고 인사말만 따로 공유·복사
  exportBlob(file.name,file.blob);
  if(navigator.share){
    try{await navigator.share({title:`${r.emp.name} 급여명세서`,text:msg});return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  try{await navigator.clipboard.writeText(msg);toastMsg('PDF를 저장했어요. 인사말은 복사해뒀습니다');}
  catch(e){toastMsg('PDF를 저장했어요');}
}

/* ---------- 파일 내보내기 공용 ---------- */
// 기본: 확인창 없이 즉시 다운로드
function exportBlob(filename,blob){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
// 다운로드가 막힌 환경용: 공유 시트로 파일 전달
async function shareBlob(filename,blob){
  try{
    const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      try{await navigator.share({files:[file],title:filename});return true;}
      catch(e){if(e&&e.name==='AbortError')return true;}
    }
  }catch(e){}
  return false;
}

/* ---------- PDF 만들기 ----------
   문서를 화면 밖(.pdf-render)에 A4 폭으로 다시 그린 뒤 이미지로 떠서 PDF 로 만든다.
   글자를 이미지로 굽기 때문에 한글 폰트를 따로 심을 필요가 없다. */
function loadScriptOnce(src){
  return new Promise(res=>{
    if(document.querySelector(`script[src="${src}"]`))return res(true);
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>res(true);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(false),8000);
  });
}
async function ensurePDFLibs(){
  if(typeof html2canvas==='undefined')
    await loadScriptOnce('vendor/html2canvas.min.js');
  if(!window.jspdf)
    await loadScriptOnce('vendor/jspdf.umd.min.js');
  return typeof html2canvas!=='undefined'&&!!window.jspdf;
}
/* innerHTML 을 A4 PDF Blob 으로. 실패하면 null */
async function buildPDFBlob(innerHTML){
  const ok=await ensurePDFLibs();
  if(!ok){toastMsg('PDF 변환기를 불러오지 못했어요. 인터넷 연결을 확인해주세요');return null;}
  const holder=document.createElement('div');
  holder.className='pdf-render';
  holder.innerHTML=innerHTML;
  document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'pt',format:'a4',orientation:'portrait'});
    const pw=pdf.internal.pageSize.getWidth();
    const ph=pdf.internal.pageSize.getHeight();
    const imgH=canvas.height*pw/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.92);
    if(imgH<=ph){
      pdf.addImage(img,'JPEG',0,0,pw,imgH);
    }else if(imgH<=ph*1.5){
      // 조금 넘치는 정도면 한 장에 맞춰 줄인다. 명세서가 2장으로 갈라지는 게 더 보기 나쁘다
      const w=pw*ph/imgH;
      pdf.addImage(img,'JPEG',(pw-w)/2,0,w,ph);
    }else{
      // 많이 길면 A4 높이만큼 잘라 여러 장으로
      let done=0;
      while(done<imgH){
        pdf.addImage(img,'JPEG',0,-done,pw,imgH);
        done+=ph;
        if(done<imgH)pdf.addPage();
      }
    }
    return pdf.output('blob');
  }catch(e){
    toastMsg('PDF 만들기에 실패했어요');
    return null;
  }finally{
    holder.remove();
  }
}
/* 급여명세서 PDF ({name, blob}) */
async function payslipPDF(r,message){
  const html=`
    <div class="pdf-head">공수뚝딱</div>
    <div class="pdf-sub">${mkLabel(state.month)} 급여명세서 · ${esc(r.emp.name)}님</div>
    ${payslipDocHTML(r)}
    ${message?`<div class="pdf-msg">${esc(message)}</div>`:''}`;
  const blob=await buildPDFBlob(html);
  if(!blob)return null;
  return {name:`${state.month}_${r.emp.name}_급여명세서.pdf`,blob};
}
/* PDF 를 공유시트로 보낸다. 카톡·메일 앱을 고르면 파일이 그대로 첨부된다.
   파일 공유가 안 되는 환경(주로 PC 브라우저)이면 false 를 돌려준다. */
async function sharePDFFile(file,title,text){
  try{
    const f=new File([file.blob],file.name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
      try{await navigator.share({files:[f],title,text});return true;}
      catch(e){if(e&&e.name==='AbortError')return 'cancelled';}
    }
  }catch(e){}
  return false;
}

/* 내 정보 저장 — 공수뚝딱은 직원이 '나' 하나뿐이다 */
async function saveMe(){
  const g=id=>document.getElementById(id);
  const price=Number(g('p_price').value);
  if(price<0){toastMsg('단가는 0보다 작을 수 없어요');return;}
  if(!DB.employees.length)DB.employees=[{id:uid(),active:true}];
  const me=DB.employees[0];
  const oldPrice=Number(me.unitPrice)||0;
  const oldCfg=empCfgOf(me);
  me.name=g('p_name').value.trim();
  me.payType=g('f_payType').value;
  me.taxType=g('f_tax').value;
  me.unitPrice=Math.max(0,price||0);
  me.otRate=Math.max(0,Number(g('p_ot').value)||0);
  me.ntRate=Math.max(0,Number(g('p_nt').value)||0);
  // 건당에서만 쓰는 칸이라 화면에 없을 때는 건드리지 않는다
  if(g('p_bh'))me.baseHourly=Math.max(0,Number(g('p_bh').value)||0);
  me.active=true;
  await saveCore();
  syncNameChanged();   // 사장님 화면의 내 이름도 같이
  const cfgChanged=JSON.stringify(oldCfg)!==JSON.stringify(empCfgOf(me));
  if(cfgChanged)await freezeEmpCfg(me.id,oldCfg);
  if(oldPrice!==me.unitPrice)await freezeRates(me.id,oldPrice,oldCfg.payType==='monthly');
  toastMsg(oldPrice!==me.unitPrice?'저장했어요. 이미 입력한 날은 예전 단가 그대로예요':'저장했어요');
  render();
}

/* 저장된 모든 달을 훑어 콜백을 돌린다. 열려 있는 달은 메모리 값을, 나머지는 저장본을 쓴다. */
async function eachStoredMonth(fn){
  if(_loadFailed)return;
  let keys=[];
  try{keys=(await window.storage.list('month-'))||[];}catch(_){keys=[];}
  const mks=new Set(Object.keys(MONTHS));
  keys.forEach(x=>{if(/^month-\d{4}-\d{2}$/.test(x.key))mks.add(x.key.slice(6));});
  for(const mk of Array.from(mks).sort()){
    const loaded=!!MONTHS[mk];
    let md=MONTHS[mk];
    if(!md){
      const hit=keys.find(x=>x.key==='month-'+mk);
      if(!hit)continue;
      try{md=JSON.parse(hit.value);}catch(_){continue;}
    }
    if(!md||typeof md!=='object')continue;
    if(!fn(mk,md))continue;
    if(loaded)saveMonth(mk);
    else{try{await window.storage.set('month-'+mk,JSON.stringify(md),false);}catch(_){}}
  }
}
/* 직원을 지우면 저장된 모든 달의 기록도 같이 지운다.
   예전에는 DB.employees 에서만 지워서, 남은 출결이 달력 합계에 계속 더해졌다
   (연습으로 넣어 둔 직원 때문에 1공수가 2로 보이던 문제). */
async function purgeEmpMonths(id){
  await eachStoredMonth((mk,md)=>{
    let hit=false;
    ['attendance','allow','advance','payRuns','mrate'].forEach(k=>{
      if(md[k]&&md[k][id]!==undefined){delete md[k][id];hit=true;}
    });
    return hit;
  });
}
/* 단가를 바꾸면 이미 입력해 둔 날들을 '바꾸기 전 단가'로 굳힌다.
   그래야 이미 정산·지급이 끝난 지난달 금액이 소급해서 바뀌지 않는다. */
async function freezeRates(id,oldPrice,wasMonthly){
  const nowMk=todayMK();
  await eachStoredMonth((mk,md)=>{
    let changed=false;
    const days=(md.attendance||{})[id]||{};
    Object.keys(days).forEach(k=>{
      let en=days[k];
      if(typeof en==='number'){en=days[k]={g:en,c:''};changed=true;}   // 아주 예전 형식
      if(!en||typeof en!=='object')return;
      if(en.r===undefined||en.r===null||en.r===''){en.r=oldPrice;changed=true;}
    });
    // 월급제는 달 단위. 출결이 없어도 이번 달까지는 예전 월급으로 굳힌다.
    if(wasMonthly&&(Object.keys(days).length||mk<=nowMk)){
      if(!md.mrate)md.mrate={};
      if(md.mrate[id]===undefined){md.mrate[id]=oldPrice;changed=true;}
    }
    return changed;
  });
}
/* 설정을 바꾸기 직전에, 계산이 확정된 달에 '바꾸기 전 값'을 굳혀 둔다.
   대상은 지난 달 전부와, 이번 달이라도 지급완료 기록이 있는 달이다.
   (이번 달에 아직 지급 전이면 설정을 고친 게 바로 반영되는 편이 자연스럽다) */
async function freezeSnapshot(fill){
  const nowMk=todayMK();
  await eachStoredMonth((mk,md)=>{
    const closed=Object.values(md.payRuns||{}).some(rs=>Object.values(rs||{}).some(r=>r&&r.status==='paid'));
    if(mk>=nowMk&&!closed)return false;
    if(!md.snap)md.snap={};
    return !!fill(md.snap,md,mk);
  });
}
// 이미 굳어 있는 달은 손대지 않는다 (처음 굳는 값만 기록)
function putSnap(s,key,val){
  if(s[key]!==undefined||val===undefined)return false;
  s[key]=val;return true;
}
async function freezeSettingsCfg(old){
  await freezeSnapshot(s=>{
    let ch=false;
    ['taxRate','insurance','employerIns','stdDayHours','stdMonthHours'].forEach(k=>{
      if(putSnap(s,k,old[k]))ch=true;
    });
    return ch;
  });
}
async function freezeTiersCfg(oldTiers){
  await freezeSnapshot(s=>putSnap(s,'mealTiers',JSON.parse(JSON.stringify(oldTiers||[]))));
}
async function freezeAllowancesCfg(oldAllow){
  await freezeSnapshot(s=>putSnap(s,'allowances',JSON.parse(JSON.stringify(oldAllow||[]))));
}
async function freezeBizModeCfg(oldMode){
  await freezeSnapshot(s=>putSnap(s,'bizMode',oldMode));
}
// 현장 팀단가는 '현장이름 → 금액' 맵으로 굳힌다. 이름이 바뀌거나 삭제돼도 지난 달 매출이 남는다.
async function freezeTeamRates(oldComps){
  const map={};
  (oldComps||[]).forEach(c=>{map[c.name]=Number(c.teamRate)||0;});
  await freezeSnapshot(s=>putSnap(s,'rates',map));
}
async function freezeEmpCfg(id,oldCfg){
  await freezeSnapshot(s=>{
    if(s.emps&&s.emps[id]!==undefined)return false;
    if(!s.emps)s.emps={};
    s.emps[id]=oldCfg;return true;
  });
}
/* 현장 이름을 바꾸면 저장된 출결의 현장 이름도 같이 바꾼다.
   출결은 현장을 이름으로 들고 있어서, 이걸 안 하면 지난 달 팀단가를 못 찾아 매출이 0이 된다. */
async function renameCompanyEverywhere(oldName,newName){
  if(!oldName||oldName===newName)return;
  DB.employees.forEach(e=>{if(e.company===oldName)e.company=newName;});
  await eachStoredMonth((mk,md)=>{
    let ch=false;
    Object.values(md.attendance||{}).forEach(days=>{
      Object.values(days||{}).forEach(en=>{
        if(en&&typeof en==='object'&&en.c===oldName){en.c=newName;ch=true;}
      });
    });
    // 이미 굳어 있는 팀단가 맵에도 새 이름을 같이 달아준다
    const rates=md.snap&&md.snap.rates;
    if(rates&&rates[oldName]!==undefined&&rates[newName]===undefined){rates[newName]=rates[oldName];ch=true;}
    return ch;
  });
}

  try{
    const old=await window.storage.list('month-');
    (old||[]).forEach(x=>{if(/^month-\d{4}-\d{2}$/.test(x.key))oldMonths[x.key.slice(6)]=x.value;});

}async function pinDigest(pin,salt){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder))throw new Error('unsupported');
  const raw=new TextEncoder().encode(`${salt}:${pin}`),buf=await crypto.subtle.digest('SHA-256',raw);
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

  if(typeof supabase==='undefined'){toastMsg('연동 모듈을 불러오지 못했어요. 인터넷 연결을 확인해주세요');return null;}
  SB=supabase.createClient(SYNC_CFG.url,SYNC_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  SB.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null,was=SYNC.user?SYNC.user.id:null;
    SYNC.user=u;
    // 콜백 안에서 곧바로 supabase 를 부르면 잠길 수 있어 한 박자 뒤에 처리한다
    if(u&&u.id!==was)setTimeout(syncAfterLogin,0);
    else if(!u&&was)setTimeout(syncAfterLogout,0);
  });
  return SB;
}
function syncHasSession(){try{return Object.keys(localStorage).some(k=>/^sb-.*-auth-token$/.test(k));}catch(_){return false;}}
/* 시작할 때: 연동을 켰거나 로그인 세션이 남아 있을 때만 모듈을 올린다. 아니면 서버에 아무 것도 안 보낸다. */
async function syncBoot(){
  if(!SYNC_ENABLED)return;
  /* ★ 딥링크 리스너는 '항상' 먼저 건다. 아래 early return 뒤에 두면 안 된다.
     예전에는 '이미 연동을 켰거나 세션이 있을 때'만 달아서, 한 번도 로그인한 적 없는
     기기에서 카카오 로그인을 마치고 돌아와도 아무도 받지 않았다
     (실기기 logcat: "Notifying listeners for event appUrlOpen / No listeners found").
     브라우저에서는 리다이렉트가 ?code= 를 달고 페이지를 새로 로드해
     supabase-js 의 detectSessionInUrl 이 알아서 처리하므로 이 결함이 안 보였다.
     2026-09-14 실기기 테스트에서 잡았다. 순서를 바꾸지 말 것. */
  const APP=capPlugin('App');
  if(APP&&APP.addListener){
    APP.addListener('appUrlOpen',ev=>{try{syncHandleDeepLink(ev&&ev.url);}catch(_){}});
    APP.addListener('appStateChange',st=>{if(st&&st.isActive)syncResume();});
  }
  try{window.addEventListener('online',()=>syncResume());}catch(_){}
  let fromOAuth=false;try{fromOAuth=/[?&#](code|access_token|error)=/.test(location.href);}catch(_){}
  if(!syncOn()&&!syncHasSession()&&!fromOAuth)return;
  await ensureSB();
}
/* 앱(안드로이드): 카카오 로그인 뒤 com.iroir.xxx://auth/callback?code=... 으로 돌아온다 */
function syncHandleDeepLink(url){
  if(!SYNC_ENABLED)return false;
  if(!url||String(url).indexOf(SYNC_CFG.scheme+'://')!==0)return false;
  const B=capPlugin('Browser');if(B&&B.close)B.close().catch(()=>{});
  let code='',err='';
  try{
    const q=new URL(String(url).replace(SYNC_CFG.scheme+'://','https://x/')).searchParams;
    code=q.get('code')||'';err=q.get('error_description')||q.get('error')||'';
  }catch(_){}
  if(err){toastMsg('로그인 실패: '+err);return true;}
  /* SB 가 아직 없을 수도 있다(앱이 중간에 재시작된 경우). 반드시 만들어 놓고 교환한다. */
  if(code)ensureSB().then(sb=>{
    if(!sb){toastMsg('로그인 모듈을 불러오지 못했어요');return;}
    return sb.auth.exchangeCodeForSession(code).then(r=>{
      if(r.error)toastMsg('로그인 실패: '+r.error.message);
    });
  }).catch(e=>toastMsg('로그인 실패: '+((e&&e.message)||e)));
  return true;
}
async function syncLogin(){
  const sb=await ensureSB();if(!sb)return;
  const native=isNativeApp();
  let redirectTo=SYNC_CFG.scheme+'://auth/callback';
  if(!native){try{redirectTo=location.origin+location.pathname;}catch(_){}}
  /* ★ scopes 를 반드시 좁혀서 보낸다.
     supabase-js 는 기본으로 account_email·profile_image 까지 요청하는데,
     account_email 은 **비즈앱 전환을 해야만** 켤 수 있는 항목이라 우리 앱에서는 켤 수 없다.
     그대로 두면 카카오가 인가 코드 요청 자체를 막는다 — KOE205
     ("설정하지 않은 카카오 로그인 동의 항목을 포함해 인가 코드를 요청했습니다").
     2026-09-13 실기 테스트에서 실제로 이 에러를 맞고 찾은 것이다. 지우지 말 것. */
  const {data,error}=await sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo,skipBrowserRedirect:native,scopes:'profile_nickname'}});
  if(error){toastMsg('카카오 로그인을 시작하지 못했어요: '+error.message);return;}
  if(native&&data&&data.url){
    const B=capPlugin('Browser');
    if(B&&B.open)B.open({url:data.url});else window.open(data.url,'_system');
  }
}

async function syncDeleteAccount(){
  const boss=SYNC_CFG.role==='owner';
  const first=boss
    ? '계정을 삭제하면 서버에서 다음이 모두 지워집니다.\n\n· 내 팀과 초대코드\n· 팀원들이 보낸 출결 신고 전부\n· 팀원들의 소속 정보\n\n이 폰에 저장된 직원·급여 기록은 그대로 남습니다.\n되돌릴 수 없습니다. 계속할까요?'
    : '계정을 삭제하면 서버에서 다음이 모두 지워집니다.\n\n· 내 소속 정보\n· 내가 보낸 출결 신고 전부 (사장님 화면에서도 사라집니다)\n\n이 폰에 저장된 내 공수·급여 기록은 그대로 남습니다.\n되돌릴 수 없습니다. 계속할까요?';
  if(!confirm(first))return;
  if(!confirm('마지막 확인입니다. 정말 삭제할까요?'))return;
  const sb=await ensureSB();if(!sb)return;
  let session=null;
  try{const r=await sb.auth.getSession();session=r&&r.data&&r.data.session;}catch(_){}
  if(!session){toastMsg('로그인 정보가 없어요. 다시 로그인해주세요');return;}
  toastMsg('계정을 삭제하는 중이에요…');
  try{
    const res=await fetch(SYNC_CFG.url+'/functions/v1/delete-account',{
      method:'POST',
      headers:{'apikey':SYNC_CFG.key,'Authorization':'Bearer '+session.access_token}
    });
    let out={};try{out=await res.json();}catch(_){}
    if(!res.ok||!out.ok)throw new Error(out.error||('서버 응답 '+res.status));
  }catch(e){
    toastMsg('삭제하지 못했어요: '+((e&&e.message)||e));

  }

  SYNC.user=null;SYNC.org=null;SYNC.members=[];SYNC.reports={};SYNC.loaded={};
  SYNC.queue=[];SYNC.sent={};
  if(typeof syncSaveState==='function'){try{await syncSaveState();}catch(_){}}
  DB.settings.sync={on:false};

}

function syncPayload(en,ymd){
  const k=kindOf(en);
  return {ymd,kind:k,gongsu:Number(en.g)||0,site:String(en.c||''),
    paid:k==='leave'?(en.p!==false):null,
    ot:Number(en.ot)||null,nt:Number(en.nt)||null,
    clock_in:en.in||null,clock_out:en.out||null};
}
function syncScanLater(mk){
  if(!syncOn()||!SYNC.org)return;
  clearTimeout(SYNC.scanT);
  SYNC.scanT=setTimeout(()=>{syncScan(mk);syncFlush();},800);
}
function syncScanAll(){Object.keys(MONTHS).forEach(mk=>syncScan(mk));}
/* 그 달에서 마지막으로 보낸 것과 달라진 날만 큐에 넣는다 */
function syncScan(mk){
  if(!syncOn()||!SYNC.org)return;
  const md=MONTHS[mk];if(!md)return;
  const me=DB.employees[0];if(!me)return;
  const days=(md.attendance||{})[me.id]||{};
  const D=dim(mk);
  let changed=false;
  for(let d=1;d<=D;d++){
    const ymd=mk+'-'+String(d).padStart(2,'0');
    const en=days[d];
    const has=!!en&&en.g!==null&&en.g!==undefined&&en.g!=='';
    const row=has?syncPayload(en,ymd):null;
    const h=row?JSON.stringify(row):'';
    if((SYNC.sent[ymd]||'')===h)continue;
    SYNC.queue=SYNC.queue.filter(q=>q.ymd!==ymd);
    SYNC.queue.push({ymd,op:row?'up':'del',row,h});
    changed=true;
  }
  if(changed){syncSaveState();syncPaintStatus();}
}
async function syncFlush(){
  if(SYNC.flushing||!SB||!SYNC.user||!SYNC.org||!syncOn()||!SYNC.queue.length)return;
  SYNC.flushing=true;
  let progressed=false;
  try{
    const ups=SYNC.queue.filter(q=>q.op==='up'),dels=SYNC.queue.filter(q=>q.op==='del');
    if(ups.length){
      const rows=ups.map(q=>Object.assign({org_id:SYNC.org.id,user_uid:SYNC.user.id},q.row));
      const r=await SB.from('reports').upsert(rows,{onConflict:'org_id,user_uid,ymd'});
      if(r.error)throw r.error;
      ups.forEach(q=>{SYNC.sent[q.ymd]=q.h;});
      SYNC.queue=SYNC.queue.filter(q=>!ups.includes(q));
      progressed=true;
    }
    for(const q of dels){
      const r=await SB.from('reports').delete().match({org_id:SYNC.org.id,user_uid:SYNC.user.id,ymd:q.ymd});
      if(r.error)throw r.error;
      delete SYNC.sent[q.ymd];
      SYNC.queue=SYNC.queue.filter(x=>x!==q);
      progressed=true;
    }
  }catch(e){
    // 신호가 없으면 다음 저장·앱 복귀·온라인 때 다시 보낸다
  }
  SYNC.flushing=false;
  await syncSaveState();
  syncPaintStatus();
  // 보내는 동안 새로 쌓인 게 있으면 한 번 더
  if(progressed&&SYNC.queue.length)setTimeout(syncFlush,1500);
}

      <div class="hint">코드는 사장님 급여뚝딱 앱 &gt; 관리 &gt; <b>팀 연동</b>에 있어요.</div>
      <button class="btn danger block sm" style="margin-top:12px;" data-act="syncDeleteAccount">계정 삭제</button></div>`;
  const n=SYNC.queue.length;
  return `<div class="card"><div class="card-title">사장님과 연결 <span class="tag blue">연결됨</span> <button class="btn sm ghost" data-act="syncLogout">로그아웃</button></div>
      <div class="li" style="cursor:default;"><div><div class="nm">${esc(c.orgName||'팀')}</div>
        <div class="meta">${n?'전송 대기 '+n+'건':'모두 전송됨'} · 사장님 화면 이름: ${esc(syncDisplayName())}</div></div>
        <button class="btn ghost sm" data-act="syncLeave">연결 끊기</button></div>
      <div class="hint">근무·휴무·연차, 현장, 연장·야간 시간, 출퇴근 시각만 보내요. 단가와 급여는 이 폰에만 있어요.</div>
      <button class="btn danger block sm" style="margin-top:12px;" data-act="syncDeleteAccount">계정 삭제</button>
      <div class="hint">계정을 지우면 서버에 있는 <b>내 소속과 출결 신고가 모두</b> 사라져요.
        <b>이 폰의 공수·급여 기록은 그대로 남습니다.</b></div></div>`;
}

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click',e=>{
  // 잠금 화면(.lock)은 배경을 눌러도 닫히면 안 된다
  if(e.target.classList&&e.target.classList.contains('overlay')&&!e.target.classList.contains('lock')){closeModal();return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  let args=[];
  if(el.dataset.args){try{args=JSON.parse(el.dataset.args);}catch(_){}}
  const fn=window[el.dataset.act];
  if(typeof fn==='function')fn(...args);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target.closest('[data-onenter]');
  if(!el)return;
  e.preventDefault();
  const fn=window[el.dataset.onenter];
  if(typeof fn==='function')fn();
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-onchange]');
  if(!el)return;
  let args=[];
  if(el.dataset.args){try{args=JSON.parse(el.dataset.args);}catch(_){}}
  const val=el.type==='checkbox'?el.checked:el.value;
  const fn=window[el.dataset.onchange];
  if(typeof fn==='function')fn(...args,val);
});

/* ---------- 홈화면 설치 아이콘 ----------
   manifest.json 과 아이콘 파일이 같은 폴더에 있으면 그대로 쓴다.
   HTML 파일 하나만 따로 열었을 때(파일 공유·아티팩트 등)는 아이콘을 코드에서 만들어 끼워넣는다.
   설치 아이콘이 하나도 없으면 안드로이드가 글자 하나로 된 임시 아이콘을 만들어 버린다. */
const APP_ICON_SVG=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E9BFF"/><stop offset="1" stop-color="#1B64DA"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#bg)"/><rect width="512" height="256" rx="115" fill="url(#sheen)"/><rect x="176" y="94" width="30" height="60" rx="15" fill="#BFD8FF"/><rect x="306" y="94" width="30" height="60" rx="15" fill="#BFD8FF"/><rect x="104" y="130" width="304" height="272" rx="44" fill="#fff"/><rect x="148" y="192" width="216" height="13" rx="6.5" fill="#CFE0FA"/><g transform="translate(256,308) scale(14.6) translate(-12,-12.05)" fill="none" stroke="#1B64DA" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"> <path d="M8.1 9.2 L9.75 14.9 L12 10.3 L14.25 14.9 L15.9 9.2"/> <path d="M7.3 11.6 H16.7"/><path d="M7.3 13.5 H16.7"/></g></svg>`;
function appIconSVGURI(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(APP_ICON_SVG);}
function appIconPNG(size){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');c.width=c.height=size;
        c.getContext('2d').drawImage(img,0,0,size,size);
        res(c.toDataURL('image/png'));
      }catch(e){res(null);}
    };
    img.onerror=()=>res(null);
    img.src=appIconSVGURI();
  });
}
async function ensureAppIcon(){
  try{
    const r=await fetch('manifest.json',{cache:'no-store'});
    if(r&&r.ok){await r.json();return;} // 파일이 같이 있으면 손대지 않는다
  }catch(e){}
  const svg=appIconSVGURI();
  document.querySelectorAll('link[rel="icon"]').forEach(l=>l.href=svg);
  const png=await appIconPNG(512);
  if(png)document.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.href=png);
  const icons=[];
  if(png){
    icons.push({src:png,sizes:'512x512',type:'image/png',purpose:'maskable'});
    icons.push({src:png,sizes:'512x512',type:'image/png',purpose:'any'});
  }
  icons.push({src:svg,sizes:'any',type:'image/svg+xml',purpose:'any'});
  const mf={name:'공수뚝딱',short_name:'공수뚝딱',lang:'ko',display:'standalone',orientation:'portrait',
    background_color:'#FFFFFF',theme_color:'#3182F6',icons};
  const link=document.querySelector('link[rel="manifest"]');
  if(link)link.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
}

/* ---------- 시작 ---------- */
(async function(){
  await loadCore();
  await loadMonth(state.month);
  if(DB.settings.privacyPinHash)showPrivacyLock();else render();
  ensureAppIcon(); // 화면 렌더를 막지 않도록 뒤에서 처리
  syncBoot();      // 사장님과 연결한 적이 있을 때만 서버에 붙는다
})();
</script>

<script>
/* ===== 웹/PWA 전용 보강 — 정본은 건드리지 않는다 =====
   1) 서비스워커 등록 (현장은 신호가 약하다 — 오프라인에서도 열려야 한다)
   2) '홈 화면에 추가' 안내

   ★ 2번이 왜 중요한가 (그냥 예쁘라고 붙인 배너가 아니다)
   iOS 는 사파리 탭으로만 쓰는 사이트의 저장소를 **7일 미접속 시 지운다**(Apple ITP).
   공수뚝딱은 임금 기록 앱이라 그게 지워지면 받을 돈의 근거가 사라진다.
   **홈 화면에 추가된 웹앱은 이 정책에서 빠진다.** 그래서 추가를 강하게 권한다. */
(function(){
  /* ---------- 1) 서비스워커 ---------- */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  /* ---------- 2) 홈 화면에 추가 ---------- */
  var ua=navigator.userAgent||'';
  var isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var standalone=(window.navigator.standalone===true)||
                 (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(standalone)return;                      // 이미 앱처럼 쓰고 있으면 조용히 있는다

  var SNOOZE='gongsu:a2hs-snooze';
  try{ if(Date.now()<Number(localStorage.getItem(SNOOZE)||0))return; }catch(e){}

  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;paint();});

  function snooze(days){
    try{localStorage.setItem(SNOOZE,String(Date.now()+days*864e5));}catch(e){}
  }

  function paint(){
    if(document.getElementById('a2hs'))return;
    var box=document.createElement('div');
    box.id='a2hs';
    box.style.cssText=[
      'position:fixed','left:12px','right:12px',
      'bottom:calc(70px + env(safe-area-inset-bottom,0px))',
      'max-width:496px','margin:0 auto','z-index:31',
      'background:#fff','border:1px solid #E5E8EB','border-radius:16px',
      'box-shadow:0 6px 24px rgba(0,0,0,.14)','padding:14px 16px',
      'font-size:13px','line-height:1.5','color:#191F28'
    ].join(';');

    var how=isIOS
      ? '사파리 아래쪽 <b>공유</b> 버튼을 누르고 <b>홈 화면에 추가</b>를 선택하세요.'
      : '아래 <b>앱 설치</b>를 누르면 홈 화면에 추가됩니다.';

    /* iOS 는 데이터가 실제로 지워질 수 있으므로 경고를 분명히 쓴다.
       안드로이드는 그 정책이 없으니 겁줄 이유가 없다 — 편의만 안내한다. */
    var why=isIOS
      ? '<div style="color:#D14343;font-weight:600;margin-bottom:4px;">기록이 사라질 수 있어요</div>'+
        '사파리로만 쓰면 아이폰이 <b>7일 뒤에 저장된 공수 기록을 지울 수 있습니다.</b> '+
        '홈 화면에 추가하면 앱처럼 열리고 기록도 안전해요.'
      : '홈 화면에 추가하면 앱처럼 빠르게 열리고, 인터넷이 없어도 켜집니다.';

    box.innerHTML=
      '<div style="font-weight:700;font-size:14px;margin-bottom:6px;">홈 화면에 추가하세요</div>'+
      '<div style="color:#4E5968;">'+why+'</div>'+
      '<div style="color:#4E5968;margin-top:8px;">'+how+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:12px;">'+
        (isIOS?'':'<button id="a2hsGo" style="flex:1;background:#3182F6;color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:600;">앱 설치</button>')+
        '<button id="a2hsNo" style="flex:'+(isIOS?'1':'0 0 auto')+';background:#F2F4F6;color:#4E5968;border:none;border-radius:10px;padding:10px 14px;font-size:13px;">나중에</button>'+
      '</div>';
    document.body.appendChild(box);

    var no=document.getElementById('a2hsNo');
    if(no)no.onclick=function(){
      /* 아이폰은 진짜로 데이터가 날아갈 수 있으니 짧게(1일)만 숨긴다.
         안드로이드는 불편함의 문제라 넉넉히(14일) 숨긴다. */
      snooze(isIOS?1:14);
      box.remove();
    };
    var go=document.getElementById('a2hsGo');
    if(go)go.onclick=function(){
      if(!deferred){box.remove();return;}
      deferred.prompt();
      deferred.userChoice.then(function(){deferred=null;box.remove();});
    };
  }

  /* 안드로이드는 beforeinstallprompt 를 기다리고, 아이폰은 그 이벤트가 없으므로 바로 띄운다.
     앱이 첫 화면을 다 그린 뒤에 붙여야 레이아웃과 겹치지 않는다. */
  if(isIOS)setTimeout(paint,1200);
})();
</script>
