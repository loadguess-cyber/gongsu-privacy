<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>공수뚝딱</title>
<!-- 홈화면 설치용 정보. 이게 없으면 안드로이드가 아이콘·이름을 임의의 글자로 만들어 버린다. -->
<meta name="application-name" content="공수뚝딱">
<meta name="theme-color" content="#3182F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공수뚝딱">
<link rel="icon" type="image/svg+xml" href="gongsu-icon.svg">
<link rel="apple-touch-icon" href="gongsu-icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --blue:#3182F6;
    --blue-deep:#1B64DA;
    --blue-tint:#EAF2FE;
    --ink:#191F28;
    --ink2:#333D4B;
    --gray:#8B95A1;
    --gray2:#B0B8C1;
    --bg:#F9FAFB;
    --line:#F2F4F6;
    --line2:#E5E8EB;
    --red:#F04452;
    --red-tint:#FDEDEE;
    --green:#12B76A;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    font-size:15px;line-height:1.45;letter-spacing:-.2px;
  }
  #app{width:100%;max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;}
  @supports not (min-height:100dvh){#app{min-height:100vh;}}

  /* ===== 헤더 ===== */
  /* 상태바(시계·안테나·배터리) 영역을 피해서 그린다.
     Android 15부터 앱이 화면 끝까지 그려지기 때문에 safe-area 만큼 위를 비워야 로고가 겹치지 않는다. */
  header{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 4px;position:sticky;top:0;z-index:20;background:var(--bg);}
  .h-row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .logo .mark{color:var(--blue);font-size:18px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--blue-tint);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    border:none;cursor:pointer;
  }
  .month-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .month-big{font-size:24px;font-weight:800;letter-spacing:-.6px;}
  .m-btns{margin-left:auto;display:flex;gap:6px;}
  .m-btns button{
    height:34px;padding:0 12px;border-radius:10px;border:none;background:#fff;
    font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);
    font-family:inherit;
  }
  .m-btns button:active{background:var(--line);}

  main{flex:1;padding:10px 16px 96px;}
  .hidden{display:none!important;}

  /* 할 일 체크리스트 */
  .todo{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .todo:last-child{border-bottom:none;}
  .todo .tbox{width:24px;height:24px;flex:none;border-radius:7px;border:1.8px solid var(--line2);
    background:#fff;color:#fff;font-size:14px;font-weight:800;cursor:pointer;line-height:1;}
  .todo.done .tbox{background:var(--blue);border-color:var(--blue);}
  .todo .ttext{flex:1;font-size:14.5px;cursor:pointer;word-break:break-all;}
  .todo.done .ttext{text-decoration:line-through;color:var(--gray2);}


  /* ===== 카드 ===== */
  .card{background:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(25,31,40,.04);}
  .card-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .muted{color:var(--gray);} .small{font-size:12.5px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;
    border-radius:14px;padding:13px 18px;font-size:14.5px;font-weight:800;font-family:inherit;
    background:var(--blue);color:#fff;transition:background .12s;
  }
  .btn:active{background:var(--blue-deep);}
  .btn.soft{background:var(--blue-tint);color:var(--blue);}
  .btn.gray{background:var(--line);color:var(--ink2);}
  .btn.ghost{background:transparent;color:var(--gray);padding:6px 8px;font-weight:700;}
  .btn.danger{background:var(--red-tint);color:var(--red);}
  .btn.block{width:100%;} .btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px;}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--gray);margin:14px 0 6px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--line2);border-radius:13px;font-size:15px;
    background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--blue);}
  .row{display:flex;gap:8px;} .row>*{flex:1;}
  .hint{font-size:12px;color:var(--gray2);margin-top:6px;line-height:1.5;}

  /* ===== 달력 ===== */
  .cal{background:#fff;border-radius:20px;padding:16px 12px 14px;box-shadow:0 1px 4px rgba(25,31,40,.04);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;}
  .cal-week div{text-align:center;font-size:12px;font-weight:700;color:var(--gray2);padding:4px 0;}
  .cal-week div:first-child,.cal-week div:last-child{color:#F27983;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .day{
    height:64px;border-radius:14px;border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:4px;gap:1px;font-family:inherit;overflow:hidden;position:relative;
  }
  .day:active{background:var(--bg);}
  .day .n{font-size:14px;font-weight:700;color:var(--ink);width:25px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;}
  /* 토·일·공휴일은 날짜를 빨간색으로 */
  .day.sun .n,.day.sat .n,.day.hol .n{color:#F27983;}
  .day .hn{
    font-size:9px;font-weight:800;color:#F27983;line-height:1.25;flex:none;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .day.out{opacity:.2;pointer-events:none;}
  .day.today{background:var(--blue-tint);}
  .day.today .n{background:var(--blue);color:#fff;}
  .day .g{
    font-size:9.5px;font-weight:800;color:var(--blue);background:var(--blue-tint);
    border-radius:7px;padding:1px 4px;line-height:1.4;flex:none;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .day .g.rest{color:#8B95A1;background:var(--line);}
  .cal-sum{
    display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);
  }
  .cal-sum b{color:var(--blue);font-weight:800;}
  .cal-sum .rest{color:var(--gray);}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--gray2);}

  /* 요약 스트립 */
  .hero{background:#fff;border-radius:20px;padding:20px;margin-top:12px;box-shadow:0 1px 4px rgba(25,31,40,.04);}
  .hero .l{font-size:13px;color:var(--gray);font-weight:700;}
  .hero .v{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:4px;}
  .hero .sub{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .hero .sub>div{flex:1;}
  .hero .sub .sl{font-size:12px;color:var(--gray);font-weight:700;}
  .hero .sub .sv{font-size:15px;font-weight:800;margin-top:2px;}
  .hero .sub .sv.blue{color:var(--blue);}
  .hero .sub .sv.red{color:var(--red);}
  /* 영업이익 계산 내역 */
  .hero .calc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;}
  .hero .calc>div{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;color:var(--gray);}
  .hero .calc b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .hero .calc b.m{color:var(--red);}
  .hero .calc .tot{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink2);font-weight:700;}
  .hero .calc .tot b{color:var(--blue);font-size:14px;}
  .hero .calc .tot b.m{color:var(--red);}
  .hero .calc .tap{cursor:pointer;border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px;}
  .hero .calc .tap:active{background:var(--line);}
  .hero .calc b.off{color:var(--gray2);font-weight:700;}
  /* 카드 안 계산 내역 상자 */
  .calcbox{font-size:13px;}
  .calcbox>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;color:var(--gray);}
  .calcbox b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .calcbox b.m{color:var(--red);}
  .calcbox .note{padding:0 0 6px;font-size:11.5px;color:var(--gray2);}
  .calcbox .mid{border-top:1px solid var(--line);margin-top:2px;padding-top:8px;color:var(--ink2);font-weight:700;}
  .calcbox .tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;color:var(--ink);font-weight:800;}
  .calcbox .tot b{color:var(--blue);font-size:16px;}
  .calcbox .tot b.m{color:var(--red);}
  /* 팀단가 선택 칩 */
  .chips.rates{display:flex;flex-wrap:wrap;gap:6px;}
  .chips.rates .chip{flex:0 0 auto;padding:7px 12px;font-size:12.5px;line-height:1.3;}
  .chips.rates .chip .rv{display:block;font-size:11px;font-weight:700;opacity:.8;}

  /* ===== 테이블 ===== */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--gray2);font-weight:700;font-size:11.5px;}
  tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;}
  /* 급여 계산 표: 5열이 폰 화면에 들어가도록 좁게 */
  .twrap table.paytable{font-size:11.5px;}
  .twrap table.paytable th,.twrap table.paytable td{padding:9px 2px;}
  .twrap table.paytable td.nm{max-width:84px;white-space:normal;word-break:keep-all;}
  .twrap table.paytable td.nm .sub{font-size:10.5px;}
  tfoot tr.gross td{border-top:1px solid var(--line2);color:var(--blue);}
  tfoot tr.gross td:last-child{font-size:14px;}
  .twrap{overflow-x:auto;margin:0 -4px;}
  .twrap table{min-width:520px;}
  /* 폰 화면에 담기는 정산표. 컬럼을 줄이고 보조 정보는 이름 아래 작은 글씨로 내린다.
     8컬럼 520px 표는 375px 폰에서 40%가 잘려 보여서 쓸 수가 없다. */
  .twrap table.fit{min-width:0;width:100%;font-size:12.5px;}
  .twrap table.fit th,.twrap table.fit td{padding:9px 3px;}
  .twrap table.fit th:first-child,.twrap table.fit td:first-child{padding-left:2px;}
  .twrap table.fit th:last-child,.twrap table.fit td:last-child{padding-right:2px;}
  .twrap table.fit .sub{display:block;font-size:10.5px;color:var(--gray2);font-weight:600;
    margin-top:2px;white-space:normal;line-height:1.35;}
  .twrap table.fit .nm{font-size:13px;}
  /* 출결 시트의 연장·야간 시간 입력 줄 */
  .ot-row{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap;}
  .ot-row .ot-l{font-size:12px;font-weight:800;color:var(--ink2);}
  .ot-row .ot-u{font-size:11px;color:var(--gray2);margin-right:6px;}
  .ot-row input{width:56px;text-align:center;padding:7px 4px;margin:0;font-size:13px;}
  .nm{font-weight:800;}
  .tag{display:inline-block;font-size:10px;background:var(--line);color:var(--ink2);border-radius:6px;padding:2px 7px;margin-left:5px;font-weight:700;}
  .tag.blue{background:var(--blue-tint);color:var(--blue);}

  .taxbadge{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:4px;}
  .taxbadge.f{background:#FFF4E5;color:#D97B0B;}
  .taxbadge.i{background:var(--blue-tint);color:var(--blue);}

  /* ===== 서브탭/리스트 ===== */
  .subtabs{display:flex;gap:6px;margin-bottom:12px;background:var(--line);padding:4px;border-radius:14px;}
  .subtabs button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--gray);cursor:pointer;font-family:inherit;}
  .subtabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .li{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
  .li:last-child{border-bottom:none;}
  .li .meta{font-size:12px;color:var(--gray);margin-top:3px;}
  .li .arrow{color:var(--gray2);font-size:16px;}
  .empty{text-align:center;color:var(--gray2);font-size:13.5px;padding:32px 10px;}

  /* ===== 바텀시트 ===== */
  .overlay{position:fixed;inset:0;background:rgba(25,31,40,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .sheet{
    background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;
    max-height:calc(90vh - env(safe-area-inset-top,0px));overflow-y:auto;padding:10px 20px calc(26px + env(safe-area-inset-bottom));
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  .grip{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:6px auto 14px;}
  @keyframes up{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h3{font-size:18px;font-weight:800;}
  .close-x{background:var(--line);border:none;width:32px;height:32px;border-radius:50%;font-size:13px;cursor:pointer;color:var(--gray);}

  /* 칩 */
  .chip{
    border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:10px 4px;
    font-size:14px;font-weight:800;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);
    /* 칸이 좁아도 '직접입력' 이 두 줄로 깨지지 않게 */
    white-space:nowrap;letter-spacing:-.3px;
  }
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .chip.clear{color:var(--red);border-color:var(--red-tint);}
  .chip.site.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .emp-block{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .emp-block .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .chips.kind{grid-template-columns:repeat(3,1fr);}
  .chip.rest.active{background:var(--gray);border-color:var(--gray);color:#fff;}
  .rate-row{display:flex;align-items:center;gap:8px;}
  .rate-row input{flex:1;}
  .chips.sites{display:flex;flex-wrap:wrap;gap:6px;}
  .chips.sites .chip{flex:0 0 auto;padding:9px 16px;font-size:13px;}
  .chips-label{font-size:11.5px;font-weight:800;color:var(--gray2);margin:10px 0 6px;}
  .custom-row{display:flex;gap:6px;margin-top:8px;}
  .custom-row input{flex:1;}

  /* 토글 스위치 */
  .switch{position:relative;width:44px;height:26px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .tr{
    position:absolute;inset:0;background:var(--line2);border-radius:26px;cursor:pointer;transition:.15s;
  }
  .switch .tr:before{
    content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;
    top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .switch input:checked+.tr{background:var(--blue);}
  .switch input:checked+.tr:before{transform:translateX(18px);}

  .seg{display:flex;border:1.5px solid var(--line2);border-radius:13px;overflow:hidden;}
  .seg button{flex:1;border:none;background:#fff;padding:11px;font-size:13px;font-weight:800;color:var(--gray);cursor:pointer;font-family:inherit;}
  .seg button.active{background:var(--blue);color:#fff;}

  /* ===== 탭바 ===== */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;max-width:520px;margin:0 auto;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:5px 1px;color:var(--gray2);font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;
    white-space:nowrap;letter-spacing:-.2px;
  }
  nav button .ic{display:flex;}
  nav button .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  nav button .ic svg .dot{fill:currentColor;stroke:none;}
  nav button.active{color:var(--blue);}
  .logo .logomark{border-radius:8px;display:block;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;font-size:13.5px;z-index:80;
    box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-weight:700;
  }
  .toast.show{opacity:1;}

  /* 문서(계산서·명세서) 전용: 폰 화면에 딱 맞는 표 */
  .doc{overflow:hidden;}
  .doc table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;min-width:0;margin:0;}
  .doc th,.doc td{border:1px solid var(--line2);padding:6px 4px;text-align:center;white-space:normal;word-break:break-all;line-height:1.4;}
  .doc th{background:var(--bg);color:var(--ink2);font-weight:800;font-size:10.5px;}
  .doc td:first-child,.doc th:first-child{text-align:center;}
  .doc h2{margin:0;}

  /* PDF 저장용 오프스크린 컨테이너. 화면 밖(left:-10000px)에서만 쓰이고 앱 화면에는 나타나지 않는다.
     .doc 는 폰 화면 기준(11.5px)이라 A4 로 뽑으면 너무 작아서, PDF 일 때만 크기를 키운다. */
  .pdf-render{position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:44px 46px;box-sizing:border-box;color:#191F28;}
  /* 폰 화면은 칸 너비를 고정(table-layout:fixed)하지만, A4 는 넓어서 내용에 맞춰 잡는 게 낫다 */
  .pdf-render .doc table{font-size:15px;table-layout:auto;}
  .pdf-render .doc td,.pdf-render .doc th{word-break:keep-all;}
  /* .nb 는 PDF 에서만 줄바꿈을 막는다. 폰 화면에는 규칙이 없어 기존 그대로 동작 */
  .pdf-render .doc td.nb{white-space:nowrap;}
  .pdf-render .doc th{font-size:14px;}
  .pdf-render .doc th,.pdf-render .doc td{padding:11px 8px;}
  .pdf-render .doc h2{font-size:27px!important;letter-spacing:10px;}
  .pdf-render .doc .small,.pdf-render .doc .muted{font-size:13px;}
  .pdf-render .pdf-head{text-align:center;font-size:16px;font-weight:800;margin:0 0 6px;}

<script>
/* ===== window.storage → localStorage (웹/PWA 용) =====
   정본 공수뚝딱_v1.html 은 호스트가 주는 window.storage 로 저장한다.
   브라우저에는 그 API 가 없으므로 같은 규약으로 localStorage 를 씌운다.
   앱 스크립트가 시작하자마자 loadCore() 를 부르므로 이 조각은 반드시
   정본 <script> 보다 **앞에** 들어가야 한다 (build-pwa.js 가 그렇게 끼운다).
   네임스페이스는 APK(storage-shim.js)와 같은 'gongsu:' 를 쓴다. */
(function(){
  if(window.storage)return;
  var NS='gongsu:';
  function later(v){return new Promise(function(r){setTimeout(function(){r(v);},0);});}
  window.storage={
    get:function(key){
      var v=null;
      try{v=localStorage.getItem(NS+key);}catch(e){}
      return later(v===null?null:{key:key,value:v});
    },
    set:function(key,value){
      try{localStorage.setItem(NS+key,String(value));}
      catch(e){return Promise.reject(e);}   // 용량 초과 → 앱의 재시도 큐가 받는다
      return later({key:key,ok:true});
    },
    delete:function(key){
      try{localStorage.removeItem(NS+key);}catch(e){}
      return later({key:key,ok:true});
    },
    list:function(prefix){
      var out=[];
      try{
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(k.indexOf(NS)!==0)continue;
          var bare=k.slice(NS.length);
          if(prefix&&bare.indexOf(prefix)!==0)continue;
          out.push({key:bare,value:localStorage.getItem(k)});
        }
      }catch(e){}
      return later(out);
    }
  };
})();
</script>
<script>
/* ========== 저장 ========== */
const CORE_KEY='core-v2';
let DB={employees:[],companies:[],mealTiers:[],allowances:[],settings:{}};
let MONTHS={};
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);}
function todayYMD(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayMK(){return todayYMD().slice(0,7);}

async function saveCore(){scheduleSave(CORE_KEY,()=>JSON.stringify(DB));}
/* 저장 큐: 연속 입력을 0.5초 단위로 모아 1회 저장, 실패 시 자동 재시도 */
const _saveQ={};
function scheduleSave(key,getData,delay){
  if(_loadFailed)return;   // 저장본을 못 읽은 상태에서는 원본을 덮어쓰지 않는다
  if(delay===undefined)delay=500;
  if(_saveQ[key]&&_saveQ[key].t)clearTimeout(_saveQ[key].t);
  _saveQ[key]={getData,t:setTimeout(()=>flushSave(key),delay)};
}
async function flushSave(key,attempt){
  attempt=attempt||0;
  const q=_saveQ[key];
  if(!q||!window.storage)return;
  if(q.t){clearTimeout(q.t);q.t=null;}
  try{
    const r=await window.storage.set(key,q.getData(),false);
    if(!r)throw new Error('empty');
    _saveBroken=false;
    if(_saveQ[key]===q)delete _saveQ[key];
  }catch(e){
    if(attempt<5){setTimeout(()=>flushSave(key,attempt+1),800*(attempt+1));return;}
    // 여기까지 왔으면 저장이 정말 안 된 것이다. 조용히 넘어가면 입력한 급여가 사라진다.
    _saveBroken=true;
    toastMsg('저장에 실패했어요. 백업 파일로 먼저 내보내주세요');
    setTimeout(()=>{if(_saveBroken)alert('기기에 데이터를 저장하지 못하고 있습니다.\n\n관리 탭 > 전체 데이터 백업에서 백업 파일을 먼저 저장해주세요.\n저장 공간이 부족하거나 브라우저 저장이 막혀 있을 수 있습니다.');},600);
  }
}
let _saveBroken=false;
function flushAll(){Object.keys(_saveQ).forEach(k=>flushSave(k));}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll();});
/* 저장본을 못 읽었을 때 원본을 덮어쓰지 않도록 잠근다.
   예전에는 파싱이 실패하면 곧바로 예시 데이터로 초기화되고,
   사용자가 뭐라도 저장하는 순간 살릴 수 있었던 원본이 사라졌다. */
let _loadFailed=false;
async function keepBroken(key,raw){
  // 'month-' 로 시작하지 않는 키에 넣어야 월 목록·백업에 섞이지 않는다
  try{await window.storage.set('broken-'+key+'-'+todayYMD(),raw,false);}catch(_){}
}
async function loadCore(){
  let raw=null;
  try{
    const r=await window.storage.get(CORE_KEY,false);
    raw=r&&r.value;
  }catch(e){
    _loadFailed=true;seed();
    setTimeout(()=>toastMsg('저장된 데이터를 읽지 못했어요. 저장이 잠겨 있어요'),400);
    return;
  }
  if(!raw){seed();await saveCore();return;}
  try{
    DB=JSON.parse(raw);
    if(!DB||!Array.isArray(DB.employees))throw new Error('형식 오류');
  }catch(e){
    _loadFailed=true;
    await keepBroken(CORE_KEY,raw);      // 손상된 원본을 따로 보관
    seed();
    setTimeout(()=>toastMsg('저장 데이터가 손상돼 새로 저장하지 않습니다. 백업 파일로 복원해주세요'),400);
    return;
  }
  const before=JSON.stringify(DB);
  migrate();
  if(JSON.stringify(DB)!==before)await saveCore();
}
function migrate(){
  DB.employees.forEach(e=>{if(!e.taxType)e.taxType='freelance';if(!e.payType)e.payType='gongsu';});
  DB.employees.forEach(e=>{if(!e.payCycle)e.payCycle='monthly';});
  if(DB.settings.bizEmail===undefined)DB.settings.bizEmail='';
  delete DB.settings.stampGeo;   // 출퇴근 기록(위치) 기능을 걷어냈다 — 2026-09-12
  // 기존 예시로 포함됐던 사업자 정보는 최초 실행 시 비운다.
  if(DB.settings.bizName==='넥스원이엔지'){
    DB.settings.bizName='';
    DB.settings.bizNumber='';
    DB.settings.ownerName='';
    DB.settings.bizAddress='';
    DB.settings.bizEmail='';
  }
  // 대표자명과 같은 직원을 최초 1회 대표로 자동 지정 (직원 정보에서 언제든 해제 가능)
  if(!DB.settings._ownerFlagged){
    const me=DB.employees.find(e=>e.name===DB.settings.ownerName);
    if(me&&me.isOwner===undefined)me.isOwner=true;
    DB.settings._ownerFlagged=true;
  }
  if(!DB.settings.insurance)DB.settings.insurance={pension:4.5,health:3.545,careRate:12.95,employment:0.9};
  if(!DB.settings.taxRate)DB.settings.taxRate=0.033;
  if(!DB.settings.payDay)DB.settings.payDay=25;
  // 사업 유형. 기본은 '급여가 지출'(대부분의 회사).
  // 인력공급처럼 급여를 현장에 청구하는 경우만 관리 탭에서 '급여가 매출'로 켠다.
  if(!DB.settings._bizModeDefaulted){DB.settings.bizMode='expense';DB.settings._bizModeDefaulted=true;}
  if(!DB.settings.bizMode)DB.settings.bizMode='expense';
  // 사업주 부담분 4대보험 (인건비 총액 계산용, 실지급에는 영향 없음)
  if(!DB.settings.employerIns)DB.settings.employerIns={pension:4.5,health:3.545,careRate:12.95,employment:1.15,accident:0.7};
  // 퇴직금 월 적립률. 법정 기준인 연간 1/12(월 8.33%)을 기본값으로 쓴다.
  if(DB.settings.retirementRate===undefined)DB.settings.retirementRate=8.33;
  if(DB.settings.showEmployerCost===undefined)DB.settings.showEmployerCost=true;
  // 최저임금(시급). 0 이면 검사하지 않는다
  if(DB.settings.minWage===undefined)DB.settings.minWage=0;
  // 연장·야간 수당의 통상시급 환산 기준
  if(!DB.settings.stdDayHours)DB.settings.stdDayHours=8;      // 1일 소정근로시간
  if(!DB.settings.stdMonthHours)DB.settings.stdMonthHours=209; // 월 소정근로시간
  if(!DB.settings.messageTemplates)DB.settings.messageTemplates={};
  if(!DB.settings.messageTemplates.slip)DB.settings.messageTemplates.slip=
    '{이름}님 안녕하세요.\n\n{월} 급여명세서를 보내드립니다.\n첨부된 PDF에서 상세 내역을 확인해주세요.\n\n한 달 동안 수고 많으셨습니다. 감사합니다.\n{회사명}';
  if(!DB.settings.messageTemplates.attend)DB.settings.messageTemplates.attend=
    '{이름}님 안녕하세요.\n\n{월} 출근·급여 확인서를 보내드립니다.\n첨부된 PDF의 출근 및 급여 내역을 확인해 주세요.\n수정할 부분이 있으면 급여일 전까지 연락 부탁드립니다.\n\n{회사명}';
  DB.employees.forEach(e=>{
    // 근로자 본인 앱에는 계좌·주민번호를 넣는 곳이 없다. 예전 데이터에 남아 있으면 지운다.
    delete e.account;delete e.resident;
    if(e.otRate===undefined)e.otRate=1.5;   // 연장 배수
    if(e.ntRate===undefined)e.ntRate=2;     // 야간 배수
    if(e.billable===undefined)e.billable=true; // 고객사 청구 대상 여부
    if(e.retirementEligible===undefined)e.retirementEligible=true; // 퇴직금 적립 적용 여부
  });
  // 성실수당/유류비 → 추가수당 시스템으로 이관
  if(!DB.allowances){
    DB.allowances=[];
    if(DB.settings.diligenceBonus)DB.allowances.push({id:'al-diligence',name:'만근수당',method:'perDay',amount:DB.settings.diligenceBonus,taxable:true});
    DB.allowances.push({id:'al-fuel',name:'유류비',method:'manual',amount:0,taxable:true});
  }
  // 만근 조건 수당 표시. 휴무는 새로 생긴 기능이라 기존 저장 데이터의 금액은 그대로 유지된다.
  DB.allowances.forEach(a=>{
    if(a.fullAttend===undefined)a.fullAttend=(a.id==='al-diligence'||/만근/.test(a.name||''));
  });
}
async function saveMonth(mk){scheduleSave('month-'+mk,()=>JSON.stringify(MONTHS[mk]));syncScanLater(mk);}   // 바뀐 날은 사장님 앱으로 신고
async function loadMonth(mk){
  if(MONTHS[mk])return MONTHS[mk];
  let raw=null;
  try{
    const r=await window.storage.get('month-'+mk,false);
    raw=r&&r.value;
  }catch(e){raw=null;}
  if(raw){
    try{
      const md=JSON.parse(raw);
      if(!md||typeof md!=='object')throw new Error('형식 오류');
      MONTHS[mk]=md;
    }catch(e){
      // 그 달 기록이 손상됐다. 빈 값으로 덮어쓰지 않도록 저장을 잠근다.
      _loadFailed=true;
      await keepBroken('month-'+mk,raw);
      MONTHS[mk]={attendance:{},allow:{}};
      setTimeout(()=>toastMsg(mkLabel(mk)+' 기록이 손상됐어요. 저장이 잠겨 있어요'),400);
    }
  }else MONTHS[mk]={attendance:{},allow:{}};
  normalizeMonth(MONTHS[mk]);
  return MONTHS[mk];
}
function normalizeMonth(md){
  // 구버전 출결(숫자) → {g,c}
  Object.entries(md.attendance||{}).forEach(([empId,days])=>{
    const emp=empById(empId);
    Object.keys(days).forEach(d=>{
      const v=days[d];
      if(typeof v==='number')days[d]={g:v,c:(emp?emp.company:'')||((DB.companies[0]||{}).name||'')};
    });
  });
  if(!md.allow)md.allow={};
  if(!md.advance)md.advance={};
  if(!md.payRuns)md.payRuns={};
  if(!md.dayMemos)md.dayMemos={};
  if(!md.mrate)md.mrate={};   // 월급제 직원의 그 달 월급 동결값
  if(!md.snap)md.snap={};
  if(!md.stamps)md.stamps={};   // 출퇴근 타임스탬프     // 그 달에 적용된 요율·식대표·수당·팀단가·직원 급여조건 동결값
  // 구버전 유류비/성실수당 제외 → 추가수당 상태로 이관
  if(md.fuel){
    Object.entries(md.fuel).forEach(([empId,v])=>{
      if(!v)return;
      if(!md.allow[empId])md.allow[empId]={};
      md.allow[empId]['al-fuel']={on:true,amt:Number(v)};
    });
    delete md.fuel;
  }
  if(md.diligenceX){
    Object.entries(md.diligenceX).forEach(([empId,off])=>{
      if(!off)return;
      if(!md.allow[empId])md.allow[empId]={};
      md.allow[empId]['al-diligence']={on:false};
    });
    delete md.diligenceX;
  }
}
const PAY_CYCLES=[{v:'weekly',label:'주급'},{v:'biweekly',label:'2주급'},{v:'monthly',label:'월급'}];
function payCycleLabel(e){return (PAY_CYCLES.find(x=>x.v===(e.payCycle||'monthly'))||PAY_CYCLES[2]).label;}
function advanceItems(md,empId){return Object.values((md.advance||{})[empId]||{});}
function advanceTotal(md,empId){return advanceItems(md,empId).reduce((sum,a)=>sum+(Number(a.amount)||0),0);}
function seed(){
  DB={
    // 공수뚝딱은 '나' 한 명뿐이다. 첫 실행에서 단가·세금만 정하면 바로 쓸 수 있다.
    employees:[{id:uid(),name:'',unitPrice:0,company:'',
                taxType:'freelance',payType:'gongsu',otRate:1.5,ntRate:2,active:true}],
    companies:[],
    // 1공수 식대는 일당에 포함된 것으로 본다: (단가-식대)*1+식대 = 단가 라 금액은 그대로고,
    // 명세서에서 기본급과 식대로 나뉘어 보이기만 한다. 1.5/2공수는 사람마다 달라 0으로 둔다.
    // 칩(1·1.5·2)만 미리 만든다. 0.5·1.15 처럼 쓸지 모르는 줄까지 깔아 두면 설정이 복잡해 보인다.
    mealTiers:[{gongsu:1,meal:15000},{gongsu:1.5,meal:0},{gongsu:2,meal:0}],
    allowances:[{id:'al-daily',name:'일비',method:'perDay',amount:0,taxable:false,fullAttend:false}],
    settings:{
      taxRate:0.033,payDay:25,minWage:0,
      stdDayHours:8,stdMonthHours:209,
      insurance:{pension:4.5,health:3.545,careRate:12.95,employment:0.9},
      employerIns:{pension:4.5,health:3.545,careRate:12.95,employment:1.15,accident:0.7},
      retirementRate:0,
      todos:[]
    }
  };
}

/* ========== 유틸 ========== */
function won(n){if(n==null||isNaN(n))n=0;return Math.round(n).toLocaleString('ko-KR')+'원';}
function num(n){if(n==null||isNaN(n))n=0;return (Math.round(n*100)/100).toLocaleString('ko-KR');}
/* 표 안에서 쓰는 금액. won() 과 같은 반올림이지만 '원' 을 붙이지 않는다 */
function amt(n){if(n==null||isNaN(n))n=0;return Math.round(n).toLocaleString('ko-KR');}
function mkLabel(mk){const[y,m]=mk.split('-');return y+'년 '+parseInt(m)+'월';}
function dim(mk){const[y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate();}
function maskR(r){if(!r)return'';const p=r.split('-');if(p.length<2)return r;return p[0]+'-'+p[1][0]+'●●●●●●';}
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// CSV 한 칸. 이름이나 현장명에 쉼표·따옴표·줄바꿈이 있어도 열이 안 밀린다.
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
/* 받침 유무에 맞는 조사 고르기 (예: josa('넥스원이엔지','이','가') → '가') */
function josa(word,withB,withoutB){
  const c=(word||'').trim().slice(-1);
  if(!c)return withB;
  const code=c.charCodeAt(0);
  if(code<0xAC00||code>0xD7A3)return withB;
  return ((code-0xAC00)%28)?withB:withoutB;
}
function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastMsg._t);toastMsg._t=setTimeout(()=>t.classList.remove('show'),1600);}
function actives(){return DB.employees.filter(e=>e.active!==false);}
function empById(id){return DB.employees.find(e=>e.id===id);}
function compByName(n){return DB.companies.find(c=>c.name===n);}
function mealFor(md,v){const t=cfgTiers(md).find(t=>Math.abs(t.gongsu-v)<1e-9);return t?t.meal:0;}
function tierExists(md,v){return cfgTiers(md).some(t=>Math.abs(t.gongsu-v)<1e-9);}
/* ===== 식대 설정 도우미 =====
   계산식 (단가 − 식대) × 공수 + 식대 는 그대로 둔다. 여기서는 표를 채워 주기만 한다.
   모드를 따로 저장하지 않고 표에서 읽어낸다 → 급여뚝딱과 저장 데이터가 똑같이 유지된다. */
const MEAL_CHIPS=[1,1.5,2];
function tierMeal(g){const t=DB.mealTiers.find(t=>Math.abs(t.gongsu-g)<1e-9);return t?Number(t.meal)||0:0;}
function tierHasG(g){return DB.mealTiers.some(t=>Math.abs(t.gongsu-g)<1e-9);}
function mealMode(){
  if(!MEAL_CHIPS.every(tierHasG))return 'custom';
  // 칩이 아닌 줄에 금액이 들어 있으면 한 줄로 설명할 수 없다
  if(DB.mealTiers.some(t=>(Number(t.meal)||0)>0&&!MEAL_CHIPS.some(g=>Math.abs(t.gongsu-g)<1e-9)))return 'custom';
  const b=tierMeal(1);
  if(MEAL_CHIPS.every(g=>tierMeal(g)===b))return 'same';
  if(MEAL_CHIPS.every(g=>tierMeal(g)===Math.round(b*g)))return 'prop';
  return 'custom';
}
function mealModeLabel(m){return m==='same'?'공수와 상관없이 같은 금액':m==='prop'?'공수에 비례':'공수별로 직접';}
/* 모드 + 1공수 기준 금액 → 칩 세 줄의 식대. 칩이 아닌 줄은 건드리지 않는다. */
function mealRowsFor(mode,base){
  const b=Math.max(0,Math.round(Number(base)||0));
  return MEAL_CHIPS.map(g=>({gongsu:g,meal:mode==='prop'?Math.round(b*g):b}));
}
function mealSummary(){
  const rows=DB.mealTiers.slice().sort((a,b)=>a.gongsu-b.gongsu);
  if(!rows.length)return '식대를 떼지 않아요';
  if(rows.every(t=>!(Number(t.meal)>0)))return '식대를 떼지 않아요';
  return rows.filter(t=>Number(t.meal)>0).map(t=>num(t.gongsu)+'공수 '+won(t.meal)).join(' · ');
}

/* ========== 월별 설정 스냅샷 ==========
   요율·식대 기준표·수당 금액·팀단가·직원 급여조건은 나중에 바꿔도
   이미 정산이 끝난 지난 달 계산이 달라지면 안 된다.
   그래서 값을 바꾸는 순간, 지난 달들에 '바꾸기 전 값'을 md.snap 에 굳혀 둔다.
   snap 에 값이 없으면 지금 설정을 그대로 쓰므로 업데이트 전 데이터의 계산 결과는 변하지 않는다. */
function snapOf(md){return (md&&md.snap)||{};}

function cfgIns(md){return pickCfg(snapOf(md).insurance,DB.settings.insurance)||{pension:4.5,health:3.545,careRate:12.95,employment:0.9};}
function cfgEIns(md){return pickCfg(snapOf(md).employerIns,DB.settings.employerIns)||{pension:4.5,health:3.545,careRate:12.95,employment:1.15,accident:0.7};}
/* 퇴직금 적립은 직원에게 실제로 나간 돈이 아니라 회사가 장부상 쌓아 두는 참고값이다.
   그래서 급여·공제·매출과 달리 월별로 동결하지 않고, 지금 설정 기준으로 전체 기간에 적용한다.
   (대상에서 뺀 직원은 지난 달 적립도 같이 없어지는 게 맞다) */
/* 근로자 앱에서는 사업주 부담·퇴직금 적립을 화면에 쓰지 않는다.
   다만 계산식은 급여뚝딱과 동일하게 유지해야 두 앱의 급여 숫자가 어긋나지 않는다. */
function retireInProfit(){return true;}
function cfgRetire(md){return Math.max(0,Number(DB.settings.retirementRate)||0);}
function cfgDayHours(md){return Number(pickCfg(snapOf(md).stdDayHours,DB.settings.stdDayHours))||8;}
function cfgMonthHours(md){return Number(pickCfg(snapOf(md).stdMonthHours,DB.settings.stdMonthHours))||209;}
function cfgSupply(md){return pickCfg(snapOf(md).bizMode,DB.settings.bizMode||'supply')==='supply';}
function cfgTiers(md){return pickCfg(snapOf(md).mealTiers,DB.mealTiers)||[];}
function cfgAllowances(md){return pickCfg(snapOf(md).allowances,DB.allowances)||[];}
/* 그 달의 현장 팀단가. 현장 이름이 바뀌거나 삭제돼도 지난 달 매출이 유지된다. */

   같은 고객사라도 현장·작업에 따라 단가가 다를 수 있어서, 고른 값을 출결에 함께 저장한다(en.tr).
   저장값이 없으면 예전처럼 현장의 기본 팀단가를 쓴다. */
function teamRateOf(md,en,name){

/* 그 달에 적용됐던 급여 조건이 반영된 직원.
   이름·계좌·주민번호처럼 돈 계산과 무관한 값은 항상 현재 값을 쓴다. */
// retirementEligible 은 일부러 뺐다 — 퇴직금은 소급해서 바뀌어야 한다 (cfgRetire 주석 참고)
const EMP_CFG_KEYS=['payType','taxType','otRate','ntRate','baseHourly','billable','isOwner','company','prorate','startDate','endDate'];
function cfgEmp(md,emp){

// 급여 방식별 단위·기본 칩
/* 급여 방식
   gongsu  공수제 — (단가-식대)×공수+식대. 식대 기준표·팀단가 매출 적용 (건설 인력공급 기본)
   daily   일급   — 일급×일수. 식대 기준표 없음
   hourly  시급   — 시급×시간
   monthly 월급   — 월 고정액. 출결은 근무일수 집계에만 쓰임
   piece   건당   — 단가×건수 */
const PAY_TYPES=[
  {v:'gongsu', label:'공수제', unit:'공수', price:'개인 단가(원/공수1)', chips:[1,1.5,2],
   desc:'(단가 − 식대) × 공수 + 식대. 식대 기준표와 현장 팀단가가 적용돼요'},
  {v:'daily',  label:'일급',   unit:'일',   price:'일급(원/일)',         chips:[0.5,1],
   desc:'일급 × 일수. 식대 기준표는 쓰지 않아요'},
  {v:'hourly', label:'시급',   unit:'시간', price:'시급(원/시간)',       chips:[4,8,10],
   desc:'시급 × 근무시간'},
  {v:'monthly',label:'월급',   unit:'출근', price:'월급(원/월)',         chips:[1],
   desc:'출근일수와 상관없이 매달 같은 금액. 출결은 근무일수 기록용이에요'},
  {v:'piece',  label:'건당',   unit:'건',   price:'건당 단가(원/건)',    chips:[1,2,3],
   desc:'단가 × 건수'}
];
function payDef(t){return PAY_TYPES.find(p=>p.v===t)||PAY_TYPES[0];}
/* 연장·야간 수당의 기준이 되는 통상시급.
   직원 정보에 직접 넣으면 그 값을 쓰고, 비워두면 급여 방식에 맞춰 환산한다.
   시급제는 시급 그대로, 월급제는 월 소정근로시간(기본 209), 나머지는 1일 소정근로시간(기본 8)으로 나눈다. */
function baseHourly(emp,rate,md){
  if(emp.baseHourly)return Number(emp.baseHourly)||0;
  const u=rate===undefined?(Number(emp.unitPrice)||0):(Number(rate)||0);
  const dh=cfgDayHours(md);
  const mh=cfgMonthHours(md);
  if(emp.payType==='hourly')return u;
  if(emp.payType==='monthly')return mh>0?u/mh:0;
  if(emp.payType==='piece')return 0;      // 건당은 시간 개념이 없어 직접 입력해야 한다
  return dh>0?u/dh:0;                     // 공수제·일급
}
function otRateOf(e){return e.otRate===undefined?1.5:(Number(e.otRate)||0);}
function ntRateOf(e){return e.ntRate===undefined?2:(Number(e.ntRate)||0);}
/* 직원 폼에서 통상시급이 어떻게 잡히는지 알려주는 문구 */
function otHintText(e){
  const bh=baseHourly(e);
  const dh=Number(DB.settings.stdDayHours)||8, mh=Number(DB.settings.stdMonthHours)||209;
  const src=e.baseHourly?'직접 입력'
    :e.payType==='hourly'?'시급 그대로'
    :e.payType==='monthly'?`월급 ÷ ${mh}시간`
    :e.payType==='piece'?'건당은 자동 환산이 안 돼요. 통상시급을 직접 넣어주세요'
    :`단가 ÷ ${dh}시간`;
  if(!bh)return `통상시급 0원 — ${src}`;
  return `통상시급 ${won(bh)} (${src}) · 연장 ${won(bh*otRateOf(e))}/시간 · 야간 ${won(bh*ntRateOf(e))}/시간`
    +' — 시간은 달력에서 날짜별로 넣어요.';
}
function payUnit(e){return payDef(e.payType).unit;}
/* 공수 빠른입력 버튼. 공수제는 1 / 1.5 / 2, 그 외 숫자는 시트의 [직접입력] 으로 넣는다. */
function payChips(e){
  return payDef(e.payType).chips;
}
/* 근무 상태 — work(근무) / off(휴무) / leave(연차).
   k 가 없는 예전 출결 데이터는 전부 '근무'로 읽으므로 기존 금액이 바뀌지 않는다. */
function kindOf(en){return en&&en.k==='off'?'off':(en&&en.k==='leave'?'leave':'work');}
function isWorkEntry(en){return kindOf(en)==='work';}
// 급여가 붙는 날 = 근무 + 유급연차. 휴무·무급연차는 급여도 근무일수도 없다.
function isPaidEntry(en){const k=kindOf(en);return k==='work'||(k==='leave'&&en.p!==false);}
function kindLabel(en){const k=kindOf(en);return k==='off'?'휴무':k==='leave'?(en.p!==false?'연차(유급)':'연차(무급)'):'';}
/* 그 날에 적용할 단가.
   출결을 입력할 때 그 시점 단가를 en.r 에 저장해 두고, 계산은 그 값을 먼저 쓴다.
   그래서 나중에 직원 단가를 올려도 이미 입력·지급된 날의 금액은 바뀌지 않는다.
   en.r 이 없는 예전 데이터만 현재 단가로 계산한다(기존 동작 유지). */
function rateOf(emp,en){
  const r=en&&en.r;
  if(r!==undefined&&r!==null&&r!=='')return Number(r)||0;

}
// 월급제는 날짜가 아니라 달 단위로 금액을 동결한다.
function monthlyRateOf(md,emp){

  return Number(emp.unitPrice)||0;
}
// 휴무·연차를 새로 찍을 때 기본으로 넣는 값
function defaultG(emp){return emp.payType==='hourly'?(Number(DB.settings.stdDayHours)||8):1;}
// 공수 개념(현장 팀단가 매출이 붙는) 급여 방식인지
function isGongsuLike(e){return e.payType==='gongsu'||e.payType==='daily'||!e.payType;}
function isBillable(emp){return emp.billable!==false;}
// 이번 달에 급여가 잡히는 직원인지 (월급제는 출결이 없어도 급여가 있다)
function hasPay(r){return r.daysWorked>0||r.net>0||r.wage>0||r.allow.taxableSum>0||r.allow.freeSum>0;}

/* ========== 계산 ========== */
function involved(mk){
  const md=MONTHS[mk]||{attendance:{}};
  const ids=new Set(Object.keys(md.attendance||{}));
  return DB.employees.filter(e=>e.active!==false||ids.has(e.id));
}
// 직원별 추가수당 계산: [{a, amt}], 세전(과세)합/세후(비과세)합
function calcAllowances(md,empId,daysWorked,hasOff){
  const items=[];let taxableSum=0,freeSum=0;
  cfgAllowances(md).forEach(a=>{
    const st=(md.allow&&md.allow[empId]&&md.allow[empId][a.id])||{};
    // 만근 조건 수당(만근수당 등)은 그 달에 휴무가 하루라도 있으면 전액 지급하지 않는다
    const blocked=!!(hasOff&&a.fullAttend);
    let amt=0;
    if(st.on!==false&&!blocked){
      if(a.method==='perDay')amt=daysWorked*a.amount;
      else if(a.method==='fixed')amt=daysWorked>0?a.amount:0;
      else amt=Number(st.amt)||0;
    }
    items.push({a,amt,on:st.on!==false,blocked});
    if(a.taxable)taxableSum+=amt;else freeSum+=amt;
  });
  return {items,taxableSum,freeSum,hasOff:!!hasOff};
}
function computeMonth(mk){
  const md=MONTHS[mk]||{attendance:{},allow:{}};
  const ins=cfgIns(md);
  const eins=cfgEIns(md);
  const supplyMode=cfgSupply(md);
  return involved(mk).map(rawEmp=>{
    const emp=cfgEmp(md,rawEmp);        // 그 달에 적용됐던 급여 조건으로 계산한다
    const billable=supplyMode&&isBillable(emp);
    const days=md.attendance[emp.id]||{};
    const marked=Object.values(days).filter(v=>v&&v.g!==null&&v.g!==undefined&&v.g!=='');
    const offDays=marked.filter(en=>kindOf(en)==='off').length;              // 휴무
    const leaveDays=marked.filter(en=>kindOf(en)==='leave').length;          // 연차(유급+무급)
    const paidLeaveDays=marked.filter(en=>kindOf(en)==='leave'&&en.p!==false).length;
    const entries=marked.filter(isPaidEntry);   // 급여가 붙는 날 = 근무 + 유급연차
    const daysWorked=entries.length;
    const gongsu=entries.reduce((a,e)=>a+Number(e.g),0);
    let meal=0,wage=0,supply=0,otH=0,ntH=0,otPay=0,ntPay=0,missingTier=false,minRate=null;
    const byComp={},byCompBill={},byCompSupply={};
    entries.forEach(en=>{
      const v=Number(en.g);
      const c=en.c||emp.company;
      const rate=rateOf(emp,en);             // 그 날 저장된 단가
      if(minRate===null||rate<minRate)minRate=rate;   // 최저임금 검사에 쓸 그 달 최저 단가
      const bill=billable&&isWorkEntry(en);  // 연차는 실제 근무가 아니라 현장에 청구하지 않는다
      byComp[c]=(byComp[c]||0)+v;
      const tr=teamRateOf(md,en,c);        // 그 날 적용된 팀단가
      if(bill){byCompBill[c]=(byCompBill[c]||0)+v;byCompSupply[c]=(byCompSupply[c]||0)+v*tr;}
      if(emp.payType==='hourly'||emp.payType==='piece'){
        // 시급제/건당: 입력값 × 단가. 식대 기준표·팀단가 매출 미적용
        wage+=rate*v;
      }else if(emp.payType==='monthly'){
        // 월급제: 출결은 근무일수 집계용일 뿐. 급여는 아래에서 월 고정액으로 잡는다
      }else if(emp.payType==='daily'){
        // 일급: 일급 × 일수. 식대 기준표는 쓰지 않고, 현장 청구는 공수제와 같게 취급
        wage+=rate*v;
        if(bill)supply+=v*tr;
      }else{
        if(!tierExists(md,v))missingTier=true;
        const m=mealFor(md,v);
        meal+=m;wage+=(rate-m)*v+m;
        // 공수제만 팀단가 매출 발생. 지출형 사업이면 매출을 잡지 않는다
        if(bill)supply+=v*tr;
      }
      // 연장·야간 수당 = 통상시급 × 배수 × 시간. 통상임금이라 과세 대상에 들어간다.
      // 실제 근무한 날만, 그 날 단가 기준으로 계산한다.
      if(isWorkEntry(en)){
        const h1=Number(en.ot)||0,h2=Number(en.nt)||0;
        if(h1||h2){
          const bh=baseHourly(emp,rate,md);
          otH+=h1;ntH+=h2;
          otPay+=bh*otRateOf(emp)*h1;
          ntPay+=bh*ntRateOf(emp)*h2;
        }
      }
    });
    // 월급제: 출근일수와 무관한 월 고정액.
    // '입·퇴사월 일할계산'을 켠 직원만 그 달 재직일수만큼 나눠 준다 (기본은 꺼져 있어 기존 금액 그대로).
    let prorateDays=0;
    if(emp.payType==='monthly'){
      wage=monthlyRateOf(md,emp);
      minRate=wage;
      if(emp.prorate){
        const D=dim(mk);
        const s=(emp.startDate||'').slice(0,7)===mk?Number((emp.startDate||'').slice(8))||1:1;
        const e=(emp.endDate||'').slice(0,7)===mk?Number((emp.endDate||'').slice(8))||D:D;
        const days=Math.max(0,Math.min(D,e)-Math.max(1,s)+1);
        if(days<D){wage=wage*days/D;prorateDays=days;}
      }
    }
    wage+=otPay+ntPay;
    const al=calcAllowances(md,emp.id,daysWorked,offDays>0);
    // 대표(사장): 공수는 매출(청구)에 반영, 급여·공제는 계산하지 않음 → 매출 전액이 이익으로 귀속
    if(emp.isOwner){
      return {emp,daysWorked,gongsu,offDays,leaveDays,paidLeaveDays,minRate,wage:0,meal:0,allow:{items:[],taxableSum:0,freeSum:0},
        otH:0,ntH:0,otPay:0,ntPay:0,
        taxBase:0,gross:0,tax:0,ded:{},net:0,byComp,byCompBill,byCompSupply,employerCost:0,retirementCost:0,laborCost:0,
        supply,vat:supply*0.1,total:supply*1.1,dist:0,profit:supply,missingTier};
    }
    const taxBase=wage+al.taxableSum;      // 세전(과세) 대상
    let tax=0,ded={};
    if(emp.taxType==='insurance'){
      const p=taxBase*ins.pension/100,h=taxBase*ins.health/100,c=h*ins.careRate/100,em=taxBase*ins.employment/100;
      ded={pension:p,health:h,care:c,employment:em};tax=p+h+c+em;
    }else{tax=taxBase*cfgTaxRate(md);ded={income:tax};}
    const netBeforeAdvance=taxBase-tax+al.freeSum; // 가불 차감 전 지급액
    const advance=advanceTotal(md,emp.id);          // 이번 달에 이미 지급한 가불
    const net=Math.max(0,netBeforeAdvance-advance); // 가불은 이번 지급액에서 한 번만 차감
    const advanceBalance=Math.max(0,advance-netBeforeAdvance);
    const gross=taxBase+al.freeSum;
    // 사업주 부담분 4대보험. 실지급에는 영향이 없고 "회사가 실제로 쓰는 인건비"를 보기 위한 값이다.
    // 3.3% 원천징수(프리랜서)는 사업주 부담이 없다.
    let employerCost=0;
    if(emp.taxType==='insurance'){
      const eh=taxBase*eins.health/100;
      employerCost=taxBase*eins.pension/100+eh+eh*eins.careRate/100
                  +taxBase*eins.employment/100+taxBase*eins.accident/100;
    }
    // 퇴직금은 직원 실지급과 별개로 회사 비용에만 월별 적립한다.
    // 적립 대상 여부는 현재 직원 설정을 그대로 본다(과거 달에도 소급 적용).
    const cur=empById(rawEmp.id)||rawEmp;
    const retirementCost=cur.retirementEligible!==false
      ?gross*cfgRetire(md)/100:0;
    // 영업이익·인건비 총액에 넣을지는 관리 설정에서 켜고 끌 수 있다.
    // (retirementCost 자체는 퇴직금 적립 현황에서 계속 보여준다)
    if(retireInProfit())employerCost+=retirementCost;
    const laborCost=gross+employerCost;     // 회사 기준 총 인건비
    const vat=supply*0.1;
    return {emp,daysWorked,gongsu,offDays,leaveDays,paidLeaveDays,prorateDays,minRate,wage,meal,allow:al,taxBase,gross,tax,ded,net,byComp,byCompBill,byCompSupply,
      otH,ntH,otPay,ntPay,employerCost,retirementCost,laborCost,advance,netBeforeAdvance,advanceBalance,
      supply,vat,total:supply+vat,dist:laborCost,profit:supply-laborCost,missingTier};
  });
}

/* ========== 대한민국 공휴일 ==========
   음력 공휴일(설날·추석·부처님오신날)은 앱에서 환산할 수 없어 연도별 표로 넣는다.
   2024~2026년은 확정된 날짜이고, 2027년 이후는 음력 환산값이라 관보로 확정되면 확인이 필요하다.
   표에 없는 연도는 양력 고정 공휴일만 표시된다. 선거일 등 수시 공휴일은 포함하지 않는다. */
const LUNAR_HOLIDAYS={
  2024:{seol:'2024-02-10',chuseok:'2024-09-17',buddha:'2024-05-15'},
  2025:{seol:'2025-01-29',chuseok:'2025-10-06',buddha:'2025-05-05'},
  2026:{seol:'2026-02-17',chuseok:'2026-09-25',buddha:'2026-05-24'},
  2027:{seol:'2027-02-06',chuseok:'2027-09-15',buddha:'2027-05-13'},
  2028:{seol:'2028-01-26',chuseok:'2028-10-03',buddha:'2028-05-02'},
  2029:{seol:'2029-02-13',chuseok:'2029-09-22',buddha:'2029-05-20'},
  2030:{seol:'2030-02-03',chuseok:'2030-09-12',buddha:'2030-05-09'}
};
const HOL_SHORT={'부처님오신날':'부처님','대체공휴일':'대체'};
const _holCache={};
function ymdOfDate(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function addDaysYMD(ymd,n){const[y,m,d]=ymd.split('-').map(Number);return ymdOfDate(new Date(y,m-1,d+n));}
function dowYMD(ymd){const[y,m,d]=ymd.split('-').map(Number);return new Date(y,m-1,d).getDay();}
/* 그 해의 'YYYY-MM-DD' → 공휴일 이름 맵.
   대체공휴일은 「관공서의 공휴일에 관한 규정」 제3조 기준으로 계산한다.
   - 삼일절·어린이날·부처님오신날·광복절·개천절·한글날·성탄절: 토·일 또는 다른 공휴일과 겹치면 대체
   - 설날·추석 연휴: 일요일 또는 다른 공휴일과 겹칠 때만 대체 (토요일은 대상 아님)
   - 신정·현충일: 대체 없음 */
function holidaysOf(year){
  if(_holCache[year])return _holCache[year];
  const list=[];
  const push=(d,name,sub)=>list.push({d,name,sub});
  push(year+'-01-01','신정','none');
  push(year+'-03-01','삼일절','weekend');
  push(year+'-05-05','어린이날','weekend');
  push(year+'-06-06','현충일','none');
  push(year+'-08-15','광복절','weekend');
  push(year+'-10-03','개천절','weekend');
  push(year+'-10-09','한글날','weekend');
  push(year+'-12-25','성탄절','weekend');
  const L=LUNAR_HOLIDAYS[year];
  if(L){
    [-1,0,1].forEach(o=>push(addDaysYMD(L.seol,o),'설날','pack'));
    [-1,0,1].forEach(o=>push(addDaysYMD(L.chuseok,o),'추석','pack'));
    push(L.buddha,'부처님오신날','weekend');
  }
  list.sort((a,b)=>a.d.localeCompare(b.d));
  const map={},taken={};
  list.forEach(h=>{if(!map[h.d])map[h.d]=h.name;taken[h.d]=true;});
  // 대체일은 그 공휴일 다음의 첫 평일에 붙인다
  const assign=from=>{
    let d=from;
    for(let i=0;i<20;i++){
      d=addDaysYMD(d,1);
      const w=dowYMD(d);
      if(taken[d]||w===0||w===6)continue;
      taken[d]=true;map[d]='대체공휴일';return;
    }
  };
  const seen={},pending=[];
  list.forEach(h=>{
    const w=dowYMD(h.d),dup=!!seen[h.d];
    seen[h.d]=true;
    if(h.sub==='none')return;
    const need=h.sub==='pack'?(w===0||dup):(w===0||w===6||dup);
    if(need)pending.push(h.d);
  });
  pending.forEach(assign);
  _holCache[year]=map;
  return map;
}
function holidayName(ymd){return holidaysOf(Number(ymd.slice(0,4)))[ymd]||'';}

/* ---------- 달력 홈 ---------- */
function vHome(){
  const mk=state.month;
  const[y,m]=mk.split('-').map(Number);
  const md=MONTHS[mk];
  const first=new Date(y,m-1,1).getDay();
  const D=dim(mk);
  const today=todayYMD();
  const perDay={};
  Object.entries(md.attendance||{}).forEach(([empId,days])=>{
    // 삭제된 직원의 남아 있는 출결은 달력 합계에 넣지 않는다
    const emp=empById(empId);
    if(!emp)return;
    Object.entries(days).forEach(([d,v])=>{
      if(!v||v.g===null||v.g===undefined||v.g==='')return;
      d=Number(d);
      if(!perDay[d])perDay[d]={cnt:0,g:0,off:0,leave:0,extra:0,hourly:true};
      const k=kindOf(v);
      if(k==='off')perDay[d].off++;
      else if(k==='leave')perDay[d].leave++;
      if(isPaidEntry(v)){
        perDay[d].cnt++;perDay[d].g+=Number(v.g);
        perDay[d].extra+=(Number(v.ot)||0)+(Number(v.nt)||0);
        if(emp.payType!=='hourly')perDay[d].hourly=false;   // 시간 단위가 아니면 합칠 수 없다
      }
    });
  });
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="day out"></div>';
  for(let d=1;d<=D;d++){
    const dow=(first+d-1)%7;
    const cls=['day'];
    if(dow===0)cls.push('sun');
    if(dow===6)cls.push('sat');
    const ymd=mk+'-'+String(d).padStart(2,'0');
    const hol=holidayName(ymd);
    if(hol)cls.push('hol');
    if(ymd===today)cls.push('today');
    const info=perDay[d];
    let inner=`<span class="n">${d}</span>`;
    if(hol)inner+=`<span class="hn">${esc(HOL_SHORT[hol]||hol)}</span>`;
    if(info){
      // 칸이 좁아서 최대한 짧게. 1명이면 숫자를 빼고 '휴'/'연'만 붙인다.
      const bits=[];
      if(info.cnt){
        // 시급제면 기본+연장+야간을 합쳐 '그 날 일한 시간' 으로 보여준다
        bits.push(info.extra ? (info.hourly ? num(info.g+info.extra) : num(info.g)+'+') : num(info.g));
      }
      if(info.off)bits.push('휴'+(info.off>1?info.off:''));
      if(info.leave)bits.push('연'+(info.leave>1?info.leave:''));
      if(bits.length)inner+=`<span class="g${info.cnt?'':' rest'}">${bits.join('')}</span>`;
    }
    cells+=`<button class="${cls.join(' ')}" data-act="openDaySheet" data-args='[${d}]'>${inner}</button>`;
  }
  const rows=computeMonth(mk);
  const workers=rows.filter(r=>r.daysWorked>0).length;
  const totG=rows.reduce((a,r)=>a+r.gongsu,0);
  const totNet=rows.reduce((a,r)=>a+Math.round(r.net),0);
  // 근무일수 = 달력에 공수가 찍힌 '날짜 수'
  const totDays=Object.keys(perDay).filter(d=>perDay[d].cnt>0).length;
  const totOff=rows.reduce((a,r)=>a+(r.offDays||0),0);
  const totLeave=rows.reduce((a,r)=>a+(r.leaveDays||0),0);
  const totOt=rows.reduce((a,r)=>a+(r.otH||0),0);
  const totNt=rows.reduce((a,r)=>a+(r.ntH||0),0);
  // 시급제만 기본+연장+야간을 한 숫자로 합칠 수 있다 (일급·건당은 단위가 달라 못 합친다)
  const allHourly=rows.every(r=>!r.daysWorked||r.emp.payType==='hourly');
  // 급여 방식이 섞여 있어도 읽히도록 단위별(공수·일·시간·건·출근)로 나눠 합계를 낸다.
  // 일급·월급처럼 근무일수와 값이 똑같이 나오는 단위는 같은 말을 두 번 하지 않도록 뺀다.
  const byUnit={},daysByUnit={};
  rows.forEach(r=>{
    if(!r.daysWorked)return;
    const u=payUnit(r.emp);
    byUnit[u]=(byUnit[u]||0)+r.gongsu;daysByUnit[u]=(daysByUnit[u]||0)+r.daysWorked;
  });
  const unitText=Object.entries(byUnit)
    .filter(([u,v])=>!((u==='일'||u==='출근')&&Math.abs(v-daysByUnit[u])<1e-9&&workers<=1))
    .map(([u,v])=>`<b>${num(v)}</b>${u}`).join(' · ');
  const missing=rows.some(r=>r.missingTier);
  const me=rows[0];   // 공수뚝딱은 '나' 한 명뿐이다
  return `
    <div class="cal">
      <div class="cal-week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-sum">
        <span>근무일수 <b>${num(totDays)}</b>일</span>
        ${unitText?`<span>${(totOt||totNt)?'기본':'총'} ${unitText}</span>`:''}
        ${totOt?`<span>연장 <b>${num(totOt)}</b>시간</span>`:''}
        ${totNt?`<span>야간 <b>${num(totNt)}</b>시간</span>`:''}
        ${(totOt||totNt)&&allHourly?`<span>합계 <b>${num(totG+totOt+totNt)}</b>시간</span>`:''}
        ${totOff?`<span class="rest">휴무 ${totOff}일</span>`:''}
        ${totLeave?`<span class="rest">연차 ${totLeave}일</span>`:''}
      </div>
      <div class="cal-legend"><span>날짜를 누르면 공수 입력</span>${syncLegend()}</div>
    </div>
    <button class="btn soft block" style="margin-top:12px;" data-act="openFillSheet">📅 평일 채우기</button>
    <div class="hero">
      <div class="l">이번 달 예상 실수령액</div>
      <div class="v">${won(totNet)}</div>
      ${me?`<div class="calc">
        <div><span>세전 급여</span><b>${won(Math.round(me.gross))}</b></div>
        ${me.tax?`<div><span>공제 ${me.emp.taxType==='insurance'?'(4대보험)':'(사업소득세 '+num(cfgTaxRate(md)*100)+'%)'}</span><b class="m">-${won(Math.round(me.tax))}</b></div>`:''}
        ${me.advance?`<div><span>가불로 먼저 받음</span><b class="m">-${won(Math.round(me.advance))}</b></div>`:''}
        <div class="tot"><span>실수령액</span><b>${won(totNet)}</b></div>
      </div>`:''}
    </div>
    ${missing?`<div class="card"><span class="tag">확인</span> <span class="small muted">식대 기준표에 없는 공수값이 있어요. 설정에서 추가해주세요.</span></div>`:''}
    ${vTodo()}
  `;
}

/* ========== 평일 공수 미리 채우기 ==========
   달을 시작할 때 평일에 기본 공수를 한 번에 넣어 두고, 실제와 다른 날만 고치는 방식.
   주말과 공휴일은 자동으로 뺀다. 이미 입력한 날은 건드리지 않는다(덮어쓰기 선택 가능). */
function openFillSheet(){
  const mk=state.month, D=dim(mk);
  const me=DB.employees[0]||{};
  const chips=payChips(me);
  const g=state.fillG!==undefined?state.fillG:(chips[0]||1);
  const sites=(DB.companies||[]);
  const site=state.fillSite||(sites[0]||{}).name||'';
  let weekdays=0, already=0;
  const md=MONTHS[mk], days=(md.attendance[me.id]||{});
  for(let d=1;d<=D;d++){
    const ymd=mk+'-'+String(d).padStart(2,'0');
    const dow=new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7))-1,d).getDay();
    if(dow===0||dow===6||holidayName(ymd))continue;
    weekdays++;
    if(days[d])already++;
  }
  state._fill={weekdays,already};
  const gChips=chips.map(v=>
    `<button class="chip ${Math.abs(v-g)<1e-9?'active':''}" data-act="setFillG" data-args='[${v}]'>${v}</button>`).join('');
  const siteChips=sites.map(c=>
    `<button class="chip site ${c.name===site?'active':''}" data-act="setFillSite" data-args='["${esc(c.name)}"]'>${esc(c.name)}</button>`).join('')
    ||'<span class="small muted">등록된 현장이 없어요 (설정에서 추가)</span>';
  openModal(mkLabel(mk)+' 평일 미리 채우기',`
    <div class="hint">주말과 공휴일은 빼고 <b>평일 ${weekdays}일</b>에 공수를 한 번에 넣어요.
      ${already?`이미 입력한 날 ${already}일은 그대로 둡니다.`:''}</div>
    <div class="chips-label" style="margin-top:14px;">넣을 공수</div>
    <div class="chips">${gChips}</div>
    <div class="chips-label">현장</div>
    <div class="chips sites">${siteChips}</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <label class="switch" style="margin:0;"><input type="checkbox" id="fill_over" data-onchange="refreshFillBtn"><span class="tr"></span></label>
      <span class="small">이미 입력한 날도 덮어쓰기</span>
    </div>
    <button class="btn block" style="margin-top:16px;" id="fill_btn" data-act="runFill">평일 ${weekdays-already}일 채우기</button>
    <button class="btn ghost block" style="margin-top:8px;" data-act="clearMonth">이번 달 전부 지우기</button>
    <button class="btn gray block" style="margin-top:8px;" data-act="closeModal">닫기</button>`);
}
/* 덮어쓰기를 켜고 끌 때 실제로 채워질 날 수를 버튼에 다시 적는다 */
function refreshFillBtn(over){
  const b=document.getElementById('fill_btn'),f=state._fill;
  if(!b||!f)return;
  b.textContent=`평일 ${over?f.weekdays:f.weekdays-f.already}일 채우기`;
}
function setFillG(v){state.fillG=Number(v)||1;openFillSheet();}
function setFillSite(n){state.fillSite=n;openFillSheet();}
async function runFill(){
  const over=document.getElementById('fill_over').checked;
  const mk=state.month, D=dim(mk), md=MONTHS[mk];
  const me=DB.employees[0]; if(!me){toastMsg('설정에서 내 정보를 먼저 넣어주세요');return;}
  const g=state.fillG!==undefined?state.fillG:(payChips(me)[0]||1);
  const site=state.fillSite||((DB.companies||[])[0]||{}).name||'';
  if(!md.attendance[me.id])md.attendance[me.id]={};
  const days=md.attendance[me.id];
  let n=0;
  for(let d=1;d<=D;d++){
    const ymd=mk+'-'+String(d).padStart(2,'0');
    const dow=new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7))-1,d).getDay();
    if(dow===0||dow===6||holidayName(ymd))continue;
    if(days[d]&&!over)continue;
    // 덮어쓰더라도 그 날 굳혀 둔 단가와 연장·야간 시간은 지킨다 (setAttend 와 같은 규칙).
    const prev=days[d]||{};
    const en={g:Number(g),c:site,
      r:(prev.r===undefined||prev.r===null||prev.r==='')?(Number(me.unitPrice)||0):prev.r};
    if(Number(prev.ot)>0)en.ot=prev.ot;
    if(Number(prev.nt)>0)en.nt=prev.nt;
    days[d]=en;
    n++;
  }
  await saveMonth(mk);
  closeModal();
  toastMsg(n?`평일 ${n}일에 ${num(g)}공수를 넣었어요`:'채울 평일이 없어요');
}
async function clearMonth(){
  const me=DB.employees[0]; if(!me)return;
  if(!confirm(mkLabel(state.month)+' 에 입력한 공수를 전부 지울까요?'))return;
  const md=MONTHS[state.month];
  delete md.attendance[me.id];
  await saveMonth(state.month);
  closeModal();toastMsg('이번 달 입력을 지웠어요');
}

/* ========== 타임스탬프 사진 ==========
   현장 사진에 날짜·시간을 찍어 준다. 사진은 앱에 담지 않고 휴대폰 사진첩에 맡긴다.
   날짜·시간은 휴대폰 설정(언어·시간대·12/24시간)을 그대로 따른다. */
function openShotPicker(){
  let inp=document.getElementById('shot_in');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.id='shot_in';
    inp.setAttribute('capture','environment');   // 휴대폰에서는 카메라가 바로 열린다
    inp.style.display='none';
    inp.addEventListener('change',()=>{
      const f=inp.files&&inp.files[0];
      inp.value='';                              // 같은 사진을 다시 골라도 동작하게
      if(f)stampPhoto(f);
    });
    document.body.appendChild(inp);
  }
  inp.click();
}
function loadImage(src){
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=src;});
}
/* 휴대폰 사진은 EXIF 회전값이 붙어 오는 일이 많다. 그대로 캔버스에 그리면 사진이 눕는다.
   createImageBitmap 이 있으면 회전을 적용해서 받고, 없으면 <img> 로 떨어뜨린다. */
async function decodePhoto(file,url){
  if(window.createImageBitmap){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}
    try{return await createImageBitmap(file);}catch(e){}
  }
  return await loadImage(url);
}
async function stampPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    toastMsg('사진에 날짜·시간을 넣는 중이에요');
    const img=await decodePhoto(file,url);
    let W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
    if(!W||!H)throw new Error('size');
    const sc=Math.min(1,2000/Math.max(W,H));   // 아주 큰 사진은 줄여서 메모리를 아낀다
    W=Math.round(W*sc);H=Math.round(H*sc);
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d');
    x.drawImage(img,0,0,W,H);
    if(img.close)img.close();   // ImageBitmap 메모리 반납
    const now=new Date();
    const lines=[now.toLocaleDateString()+' '+now.toLocaleTimeString()];
    const me=DB.employees[0]||{};
    const md=MONTHS[state.month]||{};
    const en=((md.attendance||{})[me.id]||{})[now.getDate()];
    if(en&&en.c)lines.push(en.c);
    const fs=Math.max(18,Math.round(Math.min(W,H)*0.045));   // 글자 크기는 사진 크기에 맞춘다
    const pad=Math.round(fs*0.6),gap=Math.round(fs*0.25);
    x.font='700 '+fs+'px system-ui, -apple-system, "Malgun Gothic", sans-serif';
    x.textBaseline='top';
    const wMax=lines.reduce((a,t)=>Math.max(a,x.measureText(t).width),0);
    const boxW=Math.round(wMax)+pad*2,boxH=fs*lines.length+gap*(lines.length-1)+pad*2;
    const bx=W-boxW-pad,by=H-boxH-pad;
    x.fillStyle='rgba(0,0,0,0.55)';x.fillRect(bx,by,boxW,boxH);
    x.fillStyle='#ffffff';
    lines.forEach((t,i)=>x.fillText(t,bx+pad,by+pad+i*(fs+gap)));
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
    if(!blob){toastMsg('사진을 만들지 못했어요');return;}
    const p2=v=>String(v).padStart(2,'0');
    const name='공수뚝딱_'+now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate())
               +'_'+p2(now.getHours())+p2(now.getMinutes())+'.jpg';
    if(await shareBlob(name,blob)){toastMsg('공유에서 사진첩에 저장하면 돼요');return;}
    exportBlob(name,blob);
    toastMsg('사진을 저장했어요');
  }catch(e){
    toastMsg('사진을 읽지 못했어요');
  }finally{URL.revokeObjectURL(url);}
}

/* ========== 할 일 체크리스트 ==========
   체크하면 줄이 그어진다. 달과 무관하게 계속 남는다. */
function todos(){return DB.settings.todos||(DB.settings.todos=[]);}
function vTodo(){

      <span class="ttext" data-act="toggleTodo" data-args='["${t.id}"]'>${esc(t.text)}</span>

async function addTodo(){

/* ========== 건당 — 단가가 다른 작업이 섞인 날 ==========
   '창호 5만원 3건 + 도배 8만원 2건' 처럼 섞이면 단가 하나로는 적을 수가 없다.
   항목을 넣으면 g(총 건수)와 r(가중평균 단가)을 같이 맞춰 둔다.
   급여는 지금까지와 똑같이 r × g 로만 계산하므로 급여뚝딱과 금액이 어긋나지 않는다.
   items 는 '무엇을 몇 건 했는지' 를 남기는 기록이다. */
function pieceItems(en){return (en&&Array.isArray(en.items))?en.items:[];}
function pieceQty(items){return items.reduce((a,it)=>a+(Number(it.q)||0),0);}
function pieceTotal(items){return items.reduce((a,it)=>a+(Number(it.r)||0)*(Number(it.q)||0),0);}
/* r × g 가 항목 합계와 같아지도록 가중평균 단가를 넣는다. 항목이 없으면 false. */
function syncPieceEntry(en){
  const items=pieceItems(en);
  const q=pieceQty(items);
  if(!items.length||q<=0){delete en.items;return false;}
  en.items=items;
  en.g=q;
  en.r=pieceTotal(items)/q;
  return true;
}
async function addPieceItem(empId,d){
  const emp=empById(empId); if(!emp)return;
  const nEl=document.getElementById('pi_n'),rEl=document.getElementById('pi_r'),qEl=document.getElementById('pi_q');
  if(!nEl||!rEl||!qEl)return;
  const name=(nEl.value||'').trim();
  const rate=Math.max(0,Number(rEl.value)||0);
  const qty=Math.max(0,Number(qEl.value)||0);
  if(!rate||!qty){toastMsg('단가와 건수를 넣어주세요');return;}
  const md=MONTHS[state.month];
  if(!md.attendance[empId])md.attendance[empId]={};
  let en=md.attendance[empId][d];
  if(!en){
    const site=sheetSite[siteKey(empId,d)]||emp.company||((DB.companies[0]||{}).name||'');
    en=md.attendance[empId][d]={g:0,c:site,r:0};
  }
  delete en.k;delete en.p;                       // 항목을 넣으면 그 날은 근무다
  en.items=pieceItems(en).concat([{n:name,r:rate,q:qty}]);
  syncPieceEntry(en);
  nEl.value='';rEl.value='';qEl.value='';
  await saveMonth(state.month);
  refreshEmpBlock(empId,d);
}
async function delPieceItem(empId,d,idx){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[d];
  if(!en)return;
  const items=pieceItems(en).slice();
  items.splice(idx,1);
  en.items=items;
  if(!syncPieceEntry(en))delete md.attendance[empId][d];   // 항목이 다 빠지면 그 날 기록도 지운다
  await saveMonth(state.month);
  refreshEmpBlock(empId,d);
}


/* 날짜 시트 */
// 아직 출결을 넣기 전에 골라 둔 현장. 반드시 '직원+날짜' 로 구분해야 한다.
// 예전에는 직원별로만 기억해서, 5일에 A현장을 고르면 10일 시트에도 A가 남고
// 그 상태로 공수를 누르면 10일에 저장돼 있던 현장이 A로 덮어써지는 버그가 있었다.
let sheetSite={};
function siteKey(empId,d){return empId+'|'+d;}
/* 시트 헤더의 '현장 · 8시간 + 연장 2시간 = 총 10시간' 한 줄.
   setOT 가 블록을 다시 그리지 않고 이 줄만 갈아끼우는 데도 쓴다. */
function dayStatusText(emp,d){
  const md=MONTHS[state.month];
  const en=(md.attendance[emp.id]||{})[d];
  if(!en)return '미입력';
  const unit=payUnit(emp), isMonthly=emp.payType==='monthly';
  const curG=Number(en.g), kind=kindOf(en);
  const site=en.c||sheetSite[siteKey(emp.id,d)]||emp.company||((DB.companies[0]||{}).name||'');
  if(kind==='off')return site+' · 휴무';
  if(kind==='leave')return site+' · 연차'+(en.p!==false?'(유급)':'(무급)')+' '+num(curG)+unit;
  // 연장·야간은 기본 시간/공수에 '더해서' 계산된다. 헤더에 그대로 적어야 헷갈리지 않는다.
  const otH=Number(en.ot)||0, ntH=Number(en.nt)||0;
  const extra=[otH?`연장 ${num(otH)}시간`:'',ntH?`야간 ${num(ntH)}시간`:''].filter(Boolean).join(' + ');
  // 시급제만 단위가 같아서 하나로 합칠 수 있다
  const sum=(emp.payType==='hourly'&&(otH||ntH))?` = 총 ${num(curG+otH+ntH)}시간`:'';
  return site+' · '+(isMonthly?'출근':num(curG)+unit)+(extra?' + '+extra:'')+sum;
}
function empBlockHTML(emp,d){
  const md=MONTHS[state.month];
  const en=(md.attendance[emp.id]||{})[d];
  const curG=en?Number(en.g):undefined;
  const kind=en?kindOf(en):'work';
  // 그 날 저장된 현장이 항상 우선. 저장값이 없을 때만 시트에서 고른 값을 쓴다.
  const sk=siteKey(emp.id,d);
  const site=(en&&en.c)||sheetSite[sk]||emp.company||((DB.companies[0]||{}).name||'');
  sheetSite[sk]=site;
  const quick=payChips(emp);
  const unit=payUnit(emp);
  const isMonthly=emp.payType==='monthly';
  const canExtra=emp.payType!=='gongsu';             // 연장·야간은 일급/시급/월급/건당에서만
  const base=Number(emp.unitPrice)||0;
  const siteChips=DB.companies.map(c=>
    `<button class="chip site ${c.name===site?'active':''}" data-act="pickSite" data-args='["${emp.id}",${d},"${esc(c.name)}"]'>${esc(c.name)}</button>`).join('');
  const isCustom=curG!==undefined&&!quick.includes(curG);
  const gChips=quick.map(v=>
    `<button class="chip ${kind!=='off'&&curG===v?'active':''}" data-act="setAttend" data-args='["${emp.id}",${d},${v}]'>${isMonthly?'출근':v}</button>`).join('')
    +(isMonthly?'':`<button class="chip ${kind!=='off'&&isCustom?'active':''}" data-act="showCustom" data-args='["${emp.id}",${d}]'>${kind!=='off'&&isCustom?curG:'직접입력'}</button>`)
    +`<button class="chip clear" data-act="setAttend" data-args='["${emp.id}",${d},null]'>✕</button>`;
  const kindChips=`
    <button class="chip ${kind==='work'&&en?'active':''}" data-act="setKind" data-args='["${emp.id}",${d},"work"]'>근무</button>
    <button class="chip rest ${kind==='off'?'active':''}" data-act="setKind" data-args='["${emp.id}",${d},"off"]'>휴무</button>
    <button class="chip rest ${kind==='leave'?'active':''}" data-act="setKind" data-args='["${emp.id}",${d},"leave"]'>연차</button>`;
  const leaveSeg=kind==='leave'?`<div class="seg" style="margin-top:8px;">
      <button type="button" class="${en.p!==false?'active':''}" data-act="setLeavePaid" data-args='["${emp.id}",${d},true]'>유급 · 급여 지급</button>
      <button type="button" class="${en.p===false?'active':''}" data-act="setLeavePaid" data-args='["${emp.id}",${d},false]'>무급 · 급여 없음</button>
    </div>`:'';
  // 그 날 적용된 단가. 나중에 직원 단가를 바꿔도 이 값은 그대로 남는다.
  // 건당에서 단가가 다른 작업이 섞인 날. 항목이 있으면 칩·단가칸 대신 항목으로 입력한다.
  const isPiece=emp.payType==='piece';
  const pItems=pieceItems(en);
  let pieceBlock='';
  if(isPiece&&kind!=='off'){
    const itemRows=pItems.map((it,i)=>`<div class="li">
        <div><div class="nm">${esc(it.n||'작업')}</div>
          <div class="meta">${amt(it.r)}원 × ${num(it.q)}건 = ${won((Number(it.r)||0)*(Number(it.q)||0))}</div></div>
        <button class="btn ghost sm" data-act="delPieceItem" data-args='["${emp.id}",${d},${i}]'>삭제</button>
      </div>`).join('');
    pieceBlock=`
      <div class="chips-label">작업 항목 <span class="muted">단가가 다른 일이 섞였을 때</span></div>
      ${itemRows||'<div class="small muted">아직 없어요. 아래에서 추가하세요.</div>'}
      ${pItems.length?`<div class="small" style="margin-top:8px;">합계 <b>${num(pieceQty(pItems))}건</b> · <b>${won(pieceTotal(pItems))}</b></div>`:''}
      <input type="text" id="pi_n" placeholder="작업명 (예: 창호)" style="margin-top:10px;">
      <div style="display:flex;gap:6px;margin-top:6px;align-items:center;">
        <input type="number" id="pi_r" min="0" step="1000" placeholder="단가" style="flex:1;margin:0;">
        <input type="number" id="pi_q" min="0" step="1" placeholder="건수" style="width:76px;margin:0;">
        <button class="btn sm" data-act="addPieceItem" data-args='["${emp.id}",${d}]'>추가</button>
      </div>`;
  }
  const rateRow=(en&&kind!=='off')?(isMonthly
    ?`<div class="chips-label">이 달 월급</div>
      <div class="rate-row">
        <input type="number" step="10000" min="0" value="${monthlyRateOf(md,emp)}" data-onchange="setMonthRate" data-args='["${emp.id}"]'>
        <span class="small muted">직원 설정 ${won(base)}</span>
      </div>`
    :`<div class="chips-label">이 날 ${esc(payDef(emp.payType).price)}</div>
      <div class="rate-row">
        <input type="number" step="1000" min="0" value="${rateOf(emp,en)}" data-onchange="setDayRate" data-args='["${emp.id}",${d}]'>
        <span class="small muted">직원 설정 ${won(base)}</span>
      </div>`):'';
  /* 팀단가(청구단가). 같은 고객사라도 현장·작업마다 다를 수 있어서 그 날 값을 고른다.
     고른 값은 출결에 함께 저장돼서 나중에 단가를 바꿔도 지난 기록이 안 바뀐다. */
  const statusText=esc(dayStatusText(emp,d));
  const payBadge=(emp.payType&&emp.payType!=='gongsu')?` <span class="tag">${payDef(emp.payType).label}</span>`:'';
  return `
    <div class="top">
      <span class="nm">${esc(emp.name)}${emp.isOwner?' <span class="tag blue">👑</span>':''}${payBadge}</span>
      <span class="small muted">${statusText}</span>
    </div>
    <div class="chips-label">근무 상태</div>
    <div class="chips kind">${kindChips}</div>
    ${leaveSeg}
    ${kind==='off'?'<div class="small muted" style="margin-top:6px;">휴무는 급여도 근무일수도 잡히지 않고, 만근 조건 수당은 이 달 전액 지급되지 않아요.</div>':''}
    <div class="chips-label">현장</div>
    <div class="chips sites">${siteChips}</div>
    ${pieceBlock}
    ${kind==='off'||(isPiece&&pItems.length)?'':`
    <div class="chips-label">${isMonthly?'출근 여부':unit}${canExtra?' <span class="muted">연장·야간은 빼고 넣어주세요</span>':''}</div>
    <div class="chips">${gChips}</div>`}
    ${(isPiece&&pItems.length)?'':rateRow}
    ${isMonthly?'<div class="small muted" style="margin-top:6px;">월급제라 출근을 안 넣어도 급여는 그대로 나와요. 근무일수 기록용이에요.</div>':''}
    ${canExtra&&curG!==undefined&&kind==='work'?`<div class="ot-row">
      <span class="ot-l">연장</span>
      <input type="number" step="0.5" min="0" placeholder="0" value="${en&&en.ot?en.ot:''}"
             data-onchange="setOT" data-args='["${emp.id}",${d},"ot"]'>
      <span class="ot-u">시간 ×${num(otRateOf(emp))}</span>
      <span class="ot-l">야간</span>
      <input type="number" step="0.5" min="0" placeholder="0" value="${en&&en.nt?en.nt:''}"
             data-onchange="setOT" data-args='["${emp.id}",${d},"nt"]'>
      <span class="ot-u">시간 ×${num(ntRateOf(emp))}</span>
    </div>
    <div class="small muted" style="margin-top:6px;">
      연장·야간은 위 ${unit}에 <b>더해서</b> 계산돼요 —
      8시간 일하고 연장 2시간이면 <b>기본 8 + 연장 2</b> 로 넣습니다.
      ${baseHourly(emp,rateOf(emp,en),md)
        ?`통상시급 ${won(baseHourly(emp,rateOf(emp,en),md))} 기준.`
        :'<b style="color:var(--red)">통상시급이 0원이라 연장·야간 수당이 계산되지 않아요. 설정에서 통상시급을 넣어주세요.</b>'}
    </div>`:''}
    <div class="custom-row hidden" id="cr-${emp.id}">
      <input type="number" step="0.25" min="0.25" placeholder="예: 1.25" id="ci-${emp.id}">
      <button class="btn sm" data-act="applyCustom" data-args='["${emp.id}",${d}]'>확인</button>
    </div>`;
}
// 시트 전체를 다시 그리지 않고 해당 직원 칸만 갱신 (스크롤 유지)
function refreshEmpBlock(empId,d){
  const el=document.getElementById('eb-'+empId);
  const emp=empById(empId);
  if(el&&emp)el.innerHTML=empBlockHTML(emp,d);
}
function openDaySheet(d){
  const[y,m]=state.month.split('-').map(Number);
  const ymd=state.month+'-'+String(d).padStart(2,'0');
  const dow=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  const hol=holidayName(ymd);
  sheetSite={};   // 이전에 열었던 날짜에서 고른 현장을 들고 오지 않는다
  const blocks=actives().map(emp=>`<div class="emp-block" id="eb-${emp.id}">${empBlockHTML(emp,d)}</div>`).join('')
    ||'<div class="empty">직원이 없어요. 관리 탭에서 추가해주세요.</div>';
  const memo=(MONTHS[state.month].dayMemos||{})[d]||'';
  openModal(`${parseInt(m)}월 ${d}일 (${dow})${hol?' · '+hol:''} 출근`,`
    ${blocks}
    <label>특이사항 메모</label>
    <textarea id="dayMemo" rows="3" placeholder="예: 우천으로 오후 작업 중단" data-onchange="setDayMemo" data-args='[${d}]'>${esc(memo)}</textarea>
    <button class="btn block" style="margin-top:8px;" data-act="closeModal">완료</button>
  `);
}
function setDayMemo(day,val){
  const md=MONTHS[state.month];
  if(!md.dayMemos)md.dayMemos={};
  const memo=String(val||'').trim();
  if(memo)md.dayMemos[day]=memo;else delete md.dayMemos[day];
  saveMonth(state.month);
}
function pickSite(empId,day,comp){
  sheetSite[siteKey(empId,day)]=comp;
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(en){en.c=comp;saveMonth(state.month);}
  refreshEmpBlock(empId,day);
}
// 월급제는 달 단위로 금액을 굳힌다 (그 달에 처음 출결이 잡힐 때 1회)
function snapMonthlyRate(md,emp){
  if(!md.mrate)md.mrate={};
  if(md.mrate[emp.id]===undefined)md.mrate[emp.id]=Number(emp.unitPrice)||0;
}
function setAttend(empId,day,val){
  const md=MONTHS[state.month];
  if(!md.attendance[empId])md.attendance[empId]={};
  if(val===null)delete md.attendance[empId][day];
  else{
    const emp=empById(empId);
    const prev=md.attendance[empId][day];
    const site=(prev&&prev.c)||sheetSite[siteKey(empId,day)]||emp.company||((DB.companies[0]||{}).name||'');
    const en=prev||{};
    en.g=Number(val);en.c=site;
    delete en.items;               // 칩으로 넣으면 건당 항목 입력은 해제된다
    // 그 날의 단가를 입력 시점 값으로 굳혀 둔다. 이미 이 날에 정해 둔 단가가 있으면 유지한다.
    if(en.r===undefined||en.r===null||en.r==='')en.r=Number(emp.unitPrice)||0;
    if(en.k==='off')delete en.k;   // 휴무였다가 공수를 넣으면 근무로 되돌린다
    md.attendance[empId][day]=en;
    if(emp.payType==='monthly')snapMonthlyRate(md,emp);
  }
  refreshEmpBlock(empId,day);      // 화면 먼저 갱신 (스크롤 그대로)
  saveMonth(state.month);          // 저장은 뒤에서 진행
}
/* 근무 상태 — 근무 / 휴무 / 연차 */
function setKind(empId,day,k){
  const md=MONTHS[state.month];
  const emp=empById(empId);
  if(!emp)return;
  if(!md.attendance[empId])md.attendance[empId]={};
  const prev=md.attendance[empId][day];
  const en=prev||{c:sheetSite[siteKey(empId,day)]||emp.company||((DB.companies[0]||{}).name||'')};
  if(en.r===undefined||en.r===null||en.r==='')en.r=Number(emp.unitPrice)||0;
  if(k==='work'){
    delete en.k;delete en.p;
    if(!(Number(en.g)>0))en.g=defaultG(emp);
  }else if(k==='off'){
    en.k='off';delete en.p;en.g=0;
    delete en.ot;delete en.nt;delete en.items;delete en.in;delete en.out;   // 휴무에는 연장·야간·작업항목·출퇴근이 없다
  }else{
    en.k='leave';
    if(en.p===undefined)en.p=true;           // 유급/무급은 아래 버튼으로 그때그때 고른다
    if(!(Number(en.g)>0))en.g=defaultG(emp);
    delete en.ot;delete en.nt;delete en.items;delete en.in;delete en.out;
  }
  md.attendance[empId][day]=en;
  if(emp.payType==='monthly')snapMonthlyRate(md,emp);
  refreshEmpBlock(empId,day);
  saveMonth(state.month);
}
function setLeavePaid(empId,day,paid){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(!en)return;
  en.p=!!paid;
  refreshEmpBlock(empId,day);
  saveMonth(state.month);
}
/* 그 날 단가. 입력 중 포커스가 튀지 않게 화면은 다시 그리지 않는다.
   넣은 값은 앞으로 쓸 기본 단가로도 저장한다. 지난 날은 freezeRates 로 예전 단가가
   굳혀지므로 이미 계산된 금액은 바뀌지 않는다. */
async function setDayRate(empId,day,val){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(!en)return;
  const v=Math.max(0,Number(val)||0);
  en.r=v;
  await saveMonth(state.month);
  const emp=empById(empId);
  if(!emp||!v||(Number(emp.unitPrice)||0)===v)return;
  const oldPrice=Number(emp.unitPrice)||0;
  await freezeRates(empId,oldPrice,emp.payType==='monthly');  // 지난 날은 예전 단가로 굳힌다
  emp.unitPrice=v;
  await saveCore();
  toastMsg(oldPrice?`기본 단가를 ${won(v)}으로 바꿨어요. 지난 기록은 그대로예요`
                  :`기본 단가를 ${won(v)}으로 저장했어요`);
}
/* 그 날 적용할 팀단가(청구단가). 칩으로 고르면 화면을 갱신하고, 직접 입력은 포커스 유지를 위해 갱신하지 않는다. */
function setTeamRate(empId,day,val){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(!en)return;
  en.tr=Math.max(0,Number(val)||0);
  refreshEmpBlock(empId,day);
  saveMonth(state.month);
}
function setTeamRateInput(empId,day,val){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(!en)return;
  en.tr=Math.max(0,Number(val)||0);
  saveMonth(state.month);
}
function setMonthRate(empId,val){
  const md=MONTHS[state.month];
  if(!md.mrate)md.mrate={};
  md.mrate[empId]=Math.max(0,Number(val)||0);
  saveMonth(state.month);
}
/* 연장·야간 시간 입력. 화면은 다시 그리지 않는다(입력 중 포커스가 튀지 않게) */
function setOT(empId,day,key,val){
  const md=MONTHS[state.month];
  const en=(md.attendance[empId]||{})[day];
  if(!en)return;
  // 하루에 24시간을 넘길 수는 없다. 오타로 급여가 몇 배가 되는 걸 막는다.
  const v=Math.min(24,Math.max(0,Number(val)||0));
  if(v>0)en[key]=v; else delete en[key];
  // 블록을 다시 그리면 입력 포커스가 튄다. 헤더 한 줄만 갈아끼운다.
  const emp=empById(empId);
  const line=document.querySelector('#eb-'+empId+' .top .small');
  if(emp&&line)line.textContent=dayStatusText(emp,day);
  saveMonth(state.month);
}
function showCustom(empId,day){
  const row=document.getElementById('cr-'+empId);
  row.classList.toggle('hidden');
  if(!row.classList.contains('hidden'))document.getElementById('ci-'+empId).focus();
}
function applyCustom(empId,day){
  const inp=document.getElementById('ci-'+empId);
  const emp=empById(empId);
  const v=Number(inp.value);
  if(!v||v<=0){
    inp.style.borderColor='var(--red)';inp.focus();
    setTimeout(()=>{inp.style.borderColor='';},1200);
    return;
  }
  // 오타로 하루에 말이 안 되는 값이 들어가는 걸 한 번 확인한다
  const cap=emp&&emp.payType==='hourly'?24:5;
  if(v>cap&&!confirm(`하루 ${num(v)}${emp?payUnit(emp):''} 가 맞나요?`)){inp.focus();return;}
  setAttend(empId,day,v);
}
